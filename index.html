<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="L’album du mariage d’Élodie et Alexandre, célébré le 23 mai 2026."
    >

    <title>Élodie & Alexandre — 23 mai 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --paper: #fefefe;
            --white: #ffffff;
            --background: #fefefe;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        /* =========================
           PAGE DE COUVERTURE
        ========================= */

        .page-shell {
            min-height: 100vh;
        }

        .cover {
            min-height: 100vh;
            padding: 0;
            background: var(--background);
        }

        .cover-content {
            width: 100%;
            margin: 0;
        }

        .premium-photo-wrap {
            position: relative;
            width: 100%;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: var(--background);
        }

        .premium-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .cover-overlay {
            position: absolute;
            z-index: 1;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse 90% 45% at 50% calc(100% - 1.5cm),
                    rgba(254, 254, 254, 0.40) 0%,
                    rgba(254, 254, 254, 0.24) 34%,
                    rgba(254, 254, 254, 0.09) 58%,
                    rgba(254, 254, 254, 0) 78%
                ),
                linear-gradient(
                    to bottom,
                    rgba(254, 254, 254, 0) 24%,
                    rgba(254, 254, 254, 0.02) calc(40% - 1.5cm),
                    rgba(254, 254, 254, 0.08) calc(52% - 1.5cm),
                    rgba(254, 254, 254, 0.18) calc(63% - 1.5cm),
                    rgba(254, 254, 254, 0.38) calc(73% - 1.5cm),
                    rgba(254, 254, 254, 0.68) calc(84% - 1.5cm),
                    rgba(254, 254, 254, 0.92) calc(94% - 1.5cm),
                    rgba(254, 254, 254, 1) calc(100% - 1.5cm),
                    rgba(254, 254, 254, 1) 100%
                );
        }

        .cover-invitation {
            position: absolute;
            z-index: 2;
            right: 28px;
            bottom: calc(12px + 1.5cm);
            left: 28px;
            color: var(--bordeaux);
            text-align: center;
        }

        .cover-invitation p {
            max-width: 620px;
            margin: 0 auto 12px;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(15px, 1.25vw, 19px);
            font-weight: 300;
            line-height: 1.55;
            letter-spacing: 0.02em;
            text-shadow: none;
        }

        .cover-invitation p::after {
            display: block;
            width: 120px;
            height: 1px;
            margin: 12px auto 0;
            background: rgba(99, 9, 9, 0.45);
            content: "";
        }

        .open-album {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2.6px;
            text-decoration: none;
            text-transform: uppercase;
            text-shadow: none;
        }

        .open-album::after {
            font-size: 14px;
            content: "→";
            transition: transform 0.25s ease;
        }

        .open-album:hover::after {
            transform: translateX(5px);
        }

        .page-shell {
            opacity: 1;
            transform: translateX(0);
            transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1), opacity 400ms ease;
            will-change: transform, opacity;
        }

        body.page-leaving .page-shell {
            opacity: 0;
            transform: translateX(-34px);
        }


        /* =========================
           TABLETTE ET MOBILE
        ========================= */

        @media (max-width: 900px) {

            .premium-photo-wrap {
                height: 100vh;
            }
        }

        @media (max-width: 720px) {

            .page-shell {
                margin-left: 0;
            }

            .premium-photo-wrap {
                height: 100svh;
            }

            .cover-invitation {
                right: 16px;
                bottom: calc(10px + 1.5cm);
                left: 16px;
            }

            .cover-invitation p {
                margin-bottom: 6px;
                font-size: clamp(14px, 3.8vw, 17px);
                line-height: 1.4;
            }

            .open-album {
                font-size: 9px;
                letter-spacing: 1.7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <link rel="stylesheet" href="/mariage/components/menu-lateral.css?v=3">
    <script src="/mariage/components/menu-lateral.js?v=3" defer></script>
</head>

<body>

    <main class="page-shell">

        <section class="cover">

            <div class="cover-content">

                <figure class="premium-photo-wrap">

                    <img
                        src="images/vignettes/PAGEACCUEIL.jpg"
                        alt="Couverture de l’album du mariage d’Élodie et Alexandre"
                        class="premium-photo"
                    >

                    <div class="cover-overlay" aria-hidden="true"></div>

                    <figcaption class="cover-invitation">
                        <p>
                            Replongez avec nous dans les souvenirs de cette journée inoubliable.
                        </p>

                        <a href="sommaire/" class="open-album">
                            Découvrir l’album
                        </a>
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>
</body>

</html>
