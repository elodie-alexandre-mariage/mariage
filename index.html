<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="L’album du mariage d’Élodie et Alexandre, célébré le 23 mai 2026."
    >

    <title>Élodie & Alexandre — 23 mai 2026</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --paper: #fefefe;
            --white: #ffffff;
            --background: var(--background);
            --sidebar-width: 255px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

       /* =========================
           NAVIGATION LATÉRALE
        ========================= */

        .book-sidebar {
            position: fixed;
            z-index: 1000;
            top: 0;
            bottom: 0;
            left: 0;
            width: var(--sidebar-width);
            overflow-y: auto;
            border-right: 1px solid var(--line);
            background: rgba(254, 254, 254, 0.98);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            scrollbar-width: thin;
            scrollbar-color: var(--bordeaux) transparent;
        }


        .book-sidebar::-webkit-scrollbar {
            width: 7px;
        }

        .book-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .book-sidebar::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: var(--bordeaux);
        }

        .book-sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--bordeaux-dark);
        }

        .sidebar-inner {
            min-height: 100%;
            padding: 14px 20px 24px;
        }

        .wedding-logo {
            width: 75px;
            height: auto;
            margin: 0 auto 10px;
        }

        .page-list {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0;
            list-style: none;
        }

        .page-list::before {
            position: absolute;
            top: 17px;
            bottom: 17px;
            left: 12px;
            width: 1px;
            background: #d9cbc4;
            content: "";
        }

        .page-item {
            position: relative;
        }

        .page-link {
            position: relative;
            display: grid;
            grid-template-columns: 27px 1fr;
            gap: 12px;
            align-items: center;
            min-height: 39px;
            padding: 3px 4px;
            color: #766c68;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            text-decoration: none;
            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .page-link:hover {
            color: var(--bordeaux);
            transform: translateX(2px);
        }

        .page-dot {
            position: relative;
            z-index: 1;
            display: grid;
            width: 25px;
            height: 25px;
            place-items: center;
            border: 1px solid #d8cdc7;
            border-radius: 50%;
            background: var(--background);
            color: #b4a8a2;
            font-size: 9px;
            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .page-label {
            line-height: 1.25;
        }

        /* Pages déjà visitées */
        .page-link.is-visited {
            color: var(--bordeaux);
        }

        .page-link.is-visited .page-dot {
            border-color: var(--bordeaux);
            background: var(--bordeaux);
            color: var(--white);
        }

        /* Page actuelle */
        .page-link.is-current {
            color: var(--bordeaux);
            font-weight: 700;
        }

        .page-link.is-current .page-label {
            font-weight: 700;
        }

        .page-link.is-current .page-dot {
            border-color: var(--bordeaux);
            background: var(--bordeaux);
            color: var(--white);
            transform: scale(1.18);
            box-shadow:
                0 0 0 3px rgba(99, 9, 9, 0.12),
                0 0 10px rgba(99, 9, 9, 0.10);
        }

        /* =========================
           PAGE DE COUVERTURE
        ========================= */

        .page-shell {
            min-height: 100vh;
            margin-left: var(--sidebar-width);
        }

        .cover {
            min-height: 100vh;
            padding: 0;
            background: var(--background);
        }

        .premium-photo-wrap::after {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(35, 25, 23, 0.03) 0%,
                    rgba(35, 25, 23, 0.00) 62%,
                    rgba(35, 25, 23, 0.22) 100%
                );
            pointer-events: none;
            content: "";
        }



        .cover-page {
            min-height: 100vh;
            background: var(--background);
        }

        .cover-content {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
        }

        .premium-photo-wrap {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 620px;
            margin: 0;
            overflow: hidden;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
        }

        .premium-photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .cover-invitation {
            max-width: 660px;
            margin: 24px auto 0;
            text-align: center;
        }

        .cover-invitation p {
            color: #655c58;
            font-size: 16px;
            font-style: italic;
            line-height: 1.7;
        }

        .open-album {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            color: var(--bordeaux);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .open-album::after {
            font-size: 17px;
            content: "→";
            transition: transform 0.25s ease;
        }

        .open-album:hover::after {
            transform: translateX(5px);
        }

        /* =========================
           BOUTONS PAGE PRÉCÉDENTE / SUIVANTE
        ========================= */

        .page-turn {
            position: fixed;
            z-index: 1200;
            bottom: 22px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 11px 17px;
            border: 1px solid rgba(99, 9, 9, 0.22);
            border-radius: 999px;
            background: rgba(254, 254, 254, 0.97);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            color: var(--bordeaux);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 0.6px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(53, 36, 31, 0.10);
            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .page-turn:hover {
            background: var(--bordeaux);
            color: var(--white);
            transform: translateY(-2px);
        }

        .page-turn.disabled {
            cursor: default;
            opacity: 0.45;
            pointer-events: none;
        }

        .page-turn-icon {
            font-size: 17px;
            line-height: 1;
        }

        /* =========================
           TABLETTE ET MOBILE
        ========================= */

        .mobile-menu-button {
            display: none;
        }

        
        .page-list {
            position: relative;
            list-style: none;
            margin: 0;
            padding: 0 0 0 8px;
        }

        .page-list::before {
            content: "";
            position: absolute;
            top: 18px;
            bottom: 18px;
            left: 24px;
            width: 1px;
            background: linear-gradient(
                to bottom,
                rgba(99, 9, 9, 0.78),
                rgba(99, 9, 9, 0.34) 55%,
                rgba(99, 9, 9, 0.12)
            );
        }

        .page-item {
            position: relative;
            margin: 0;
            padding: 0;
        }

        .page-link {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 34px 1fr;
            align-items: center;
            min-height: 39px;
            padding: 3px 4px;
            color: #7a7471;
            font-size: 12px;
            text-decoration: none;
        }

        .page-dot {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            color: #9c9591;
            font-family: Georgia, serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            background: #fefefe;
            border: 1px solid rgba(99, 9, 9, 0.18);
            border-radius: 50%;
            box-shadow: 0 0 0 5px #fefefe;
            transition:
                color 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .page-label {
            padding-left: 8px;
            color: inherit;
            font-size: 12px;
            line-height: 1.2;
            letter-spacing: 0.015em;
            transition: color 0.2s ease, font-weight 0.2s ease;
        }

        .page-link.is-visited .page-dot {
            color: #ffffff;
            background: #630909;
            border-color: #630909;
        }

        .page-link.is-current .page-dot {
            color: #ffffff;
            font-weight: 700;
            background: #630909;
            border-color: #630909;
            transform: scale(1.09);
            box-shadow:
                0 0 0 5px #fefefe,
                0 0 0 6px rgba(99, 9, 9, 0.28),
                0 0 16px rgba(99, 9, 9, 0.18);
        }

        .page-link.is-current .page-label {
            color: #630909;
            font-weight: 700;
        }

        .page-link:hover .page-dot {
            border-color: rgba(99, 9, 9, 0.55);
            transform: scale(1.05);
        }

        .page-link:hover .page-label {
            color: #630909;
        }

@media (max-width: 900px) {

            .cover-page,
            .premium-photo-wrap {
                min-height: 100svh;
                height: 100svh;
            }

            .premium-photo {
                height: 100%;
                object-fit: cover;
            }

            .cover-invitation {
                bottom: 22px;
                width: calc(100% - 24px);
                padding: 28px 18px 20px;
            }

            .cover-invitation p {
                font-size: 15px;
            }

            :root {
                --sidebar-width: 220px;
            }

    
        .sidebar-inner {
                padding-right: 18px;
                padding-left: 18px;
            }

            .cover {
                padding-right: 28px;
                padding-left: 28px;
            }
        }

        @media (max-width: 720px) {
            :root {
                --sidebar-width: 0px;
            }

            .mobile-menu-button {
                position: fixed;
                z-index: 1400;
                top: 14px;
                left: 14px;
                display: inline-grid;
                width: 44px;
                height: 44px;
                place-items: center;
                border: 1px solid rgba(99, 9, 9, 0.20);
                border-radius: 50%;
                background: rgba(254, 254, 254, 0.98);
                color: var(--bordeaux);
                font-size: 19px;
                box-shadow: 0 8px 24px rgba(53, 36, 31, 0.10);
            }

            .book-sidebar {
                width: min(82vw, 300px);
                transform: translateX(-105%);
                transition: transform 0.3s ease;
            }

            .book-sidebar.is-open {
                transform: translateX(0);
            }

            .page-shell {
                margin-left: 0;
            }

            .cover {
                padding: 58px 16px 96px;
            }

            .premium-photo {
                height: 68vh;
                min-height: 420px;
            }

            .page-turn {
                bottom: 14px;
                min-height: 44px;
                padding: 10px 14px;
                font-size: 10px;
            }

            .page-turn.next {
                right: 14px;
            }

            .page-turn-text {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <button
        class="mobile-menu-button"
        type="button"
        aria-label="Ouvrir le sommaire"
        aria-controls="book-sidebar"
        aria-expanded="false"
    >
        ☰
    </button>

    <aside
        class="book-sidebar"
        id="book-sidebar"
        aria-label="Pages de l’album"
    >

        <div class="sidebar-inner">

            <img
                src="images/style/logosansfond.jpg"
                alt="Logo du mariage d’Élodie et Alexandre"
                class="wedding-logo"
            >

            <nav aria-label="Navigation principale">

                <ol class="page-list">

                    <li class="page-item">
                        <a
                            href="./"
                            class="page-link is-current"
                            data-page="bienvenue"
                            aria-current="page"
                        >
                            <span class="page-dot">01</span>
                            <span class="page-label">Bienvenue</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="sommaire/" class="page-link" data-page="sommaire">
                            <span class="page-dot">02</span>
                            <span class="page-label">Sommaire</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="invitation/" class="page-link" data-page="invitation">
                            <span class="page-dot">03</span>
                            <span class="page-label">Invitation</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="preparatifs/" class="page-link" data-page="preparatifs">
                            <span class="page-dot">04</span>
                            <span class="page-label">Préparatifs</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="first-look/" class="page-link" data-page="first-look">
                            <span class="page-dot">05</span>
                            <span class="page-label">First Look</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="mairie/" class="page-link" data-page="mairie">
                            <span class="page-dot">06</span>
                            <span class="page-label">Mairie</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="eglise/" class="page-link" data-page="eglise">
                            <span class="page-dot">07</span>
                            <span class="page-label">Église</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="vin_d_honneur/" class="page-link" data-page="vin-d-honneur">
                            <span class="page-dot">08</span>
                            <span class="page-label">Vin d’honneur</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="soiree/" class="page-link" data-page="soiree">
                            <span class="page-dot">09</span>
                            <span class="page-label">Soirée</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="videos/" class="page-link" data-page="videos">
                            <span class="page-dot">10</span>
                            <span class="page-label">Vidéos</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="photoscouple/" class="page-link" data-page="photos-couple">
                            <span class="page-dot">11</span>
                            <span class="page-label">Photos de couple</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="photosgroupe/" class="page-link" data-page="photos-groupe">
                            <span class="page-dot">12</span>
                            <span class="page-label">Photos de groupe</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="photobooth/" class="page-link" data-page="photobooth">
                            <span class="page-dot">13</span>
                            <span class="page-label">Photobooth</span>
                        </a>
                    </li>

                    <li class="page-item">
                        <a href="remerciements/" class="page-link" data-page="remerciements">
                            <span class="page-dot">14</span>
                            <span class="page-label">Remerciements</span>
                        </a>
                    </li>

                </ol>

            </nav>

        </div>

    </aside>

    <main class="page-shell">

        <section class="cover">

            <div class="cover-content">

                <figure class="premium-photo-wrap">

                    <img
                        src="images/vignettes/PAGEACCUEIL.jpg"
                        alt="Couverture de l’album du mariage d’Élodie et Alexandre"
                        class="premium-photo"
                    >

                <div class="cover-invitation">
                    <p>Replongez avec nous dans les souvenirs de cette journée inoubliable.</p>

                    <a href="sommaire/" class="open-album">
                        Découvrir notre album
                    </a>
                </div>

                </figure>

            </div>

        </section>

    </main>
        <span class="page-turn-text">Page précédente</span>
    </span>

    <script>
        const currentPage = "bienvenue";

        const pageOrder = [
            "bienvenue",
            "sommaire",
            "invitation",
            "preparatifs",
            "first-look",
            "mairie",
            "eglise",
            "vin-d-honneur",
            "soiree",
            "videos",
            "photos-couple",
            "photos-groupe",
            "photobooth",
            "remerciements"
        ];

        const currentIndex = pageOrder.indexOf(currentPage);

        document.querySelectorAll(".page-link").forEach((link) => {
            const pageName = link.dataset.page;
            const pageIndex = pageOrder.indexOf(pageName);

            link.classList.remove("is-current", "is-visited");
            link.removeAttribute("aria-current");

            if (pageIndex < currentIndex) {
                link.classList.add("is-visited");
            }

            if (pageName === currentPage) {
                link.classList.add("is-current");
                link.setAttribute("aria-current", "page");
            }
        });

        const menuButton = document.querySelector(".mobile-menu-button");
        const sidebar = document.querySelector(".book-sidebar");

        menuButton.addEventListener("click", () => {
            const isOpen = sidebar.classList.toggle("is-open");
            menuButton.setAttribute("aria-expanded", String(isOpen));
            menuButton.textContent = isOpen ? "×" : "☰";
        });

        document.addEventListener("click", (event) => {
            const clickedInsideSidebar = sidebar.contains(event.target);
            const clickedMenuButton = menuButton.contains(event.target);

            if (
                window.innerWidth <= 720 &&
                sidebar.classList.contains("is-open") &&
                !clickedInsideSidebar &&
                !clickedMenuButton
            ) {
                sidebar.classList.remove("is-open");
                menuButton.setAttribute("aria-expanded", "false");
                menuButton.textContent = "☰";
            }
        });
    </script>

</body>

</html>
