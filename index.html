<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="L’album du mariage d’Élodie et Alexandre, célébré le 23 mai 2026."
    >

    <title>Élodie & Alexandre — 23 mai 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --paper: #fefefe;
            --white: #ffffff;
            --background: #fefefe;
            --sidebar-width: 290px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        /* =========================
           NAVIGATION LATÉRALE
        ========================= */

        .book-sidebar {
            position: fixed;
            z-index: 1000;
            top: 0;
            bottom: 0;
            left: 0;
            width: var(--sidebar-width);
            overflow-y: auto;
            border-right: 1px solid var(--line);
            background: rgba(254, 254, 254, 0.98);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            scrollbar-width: thin;
            scrollbar-color: var(--bordeaux) transparent;
        }

        .book-sidebar::-webkit-scrollbar { width: 7px; }
        .book-sidebar::-webkit-scrollbar-track { background: transparent; }
        .book-sidebar::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--bordeaux); }
        .book-sidebar::-webkit-scrollbar-thumb:hover { background: var(--bordeaux-dark); }

        .sidebar-inner {
            display: flex;
            min-height: 100%;
            flex-direction: column;
            padding: 18px 25px 27px;
        }

        .wedding-logo {
            width: 110px;
            height: auto;
            margin: 0 auto 18px;
        }

        .page-list {
            position: relative;
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .page-list::before {
            position: absolute;
            top: 17px;
            bottom: 17px;
            left: 16px;
            width: 1px;
            background: #d9cbc4;
            content: "";
        }

        .page-item { position: relative; }
        .page-item:not(.page-item-separated) { margin-bottom: 8px; }

        .menu-annexe {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: auto;
            padding: 20px 5px 8px;
        }

        .menu-annexe-line {
            width: 100%;
            height: 1px;
            margin-bottom: 16px;
            background: rgba(99, 9, 9, 0.16);
        }

        .menu-annexe-title {
            padding-left: 49px;
            color: rgba(99, 9, 9, 0.68);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        .page-item-separated { margin-top: 0; padding-top: 4px; border-top: 0; }

        .page-link {
            position: relative;
            display: grid;
            grid-template-columns: 35px 1fr;
            gap: 16px;
            align-items: center;
            min-height: 46px;
            padding: 2px 5px;
            color: #766c68;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0.015em;
            text-decoration: none;
            transition: color 0.35s ease, transform 0.35s ease;
        }

        .page-link:hover { color: var(--bordeaux); transform: translateX(2px); }

        .page-dot {
            position: relative;
            z-index: 1;
            display: grid;
            width: 33px;
            height: 33px;
            place-items: center;
            flex: 0 0 auto;
            border: 1px solid rgba(99, 9, 9, 0.24);
            border-radius: 50%;
            background: #fefefe;
            color: #a99c96;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 10.5px;
            font-weight: 400;
            transition: all 0.35s ease;
        }

        .page-label { line-height: 1.35; }
        .page-link.is-visited { color: rgba(99, 9, 9, 0.70); }
        .page-link.is-visited .page-dot {
            border-color: rgba(99, 9, 9, 0.72);
            background: var(--background);
            color: var(--bordeaux);
            box-shadow: inset 0 0 0 3px rgba(99, 9, 9, 0.06);
        }

        .page-link.is-current { color: var(--bordeaux); font-weight: 700; }
        .page-link.is-current .page-label {
            justify-self: center;
            width: 100%;
            padding-right: 8px;
            font-family: "Segoe Script", "Lucida Handwriting", "Brush Script MT", "Snell Roundhand", cursive;
            font-size: 17px;
            font-weight: 400;
            line-height: 1.1;
            text-align: center;
        }

        .page-link.is-current .page-dot {
            border-color: var(--bordeaux);
            background: var(--bordeaux);
            color: var(--white);
            transform: scale(1.18);
            box-shadow: 0 0 0 3px rgba(99, 9, 9, 0.12), 0 0 10px rgba(99, 9, 9, 0.10);
        }

        /* =========================
           PAGE DE COUVERTURE
        ========================= */

        .page-shell {
            min-height: 100vh;
            margin-left: var(--sidebar-width);
        }

        .cover {
            min-height: 100vh;
            padding: 0;
            background: var(--background);
        }

        .cover-content {
            width: 100%;
            margin: 0;
        }

        .premium-photo-wrap {
            position: relative;
            width: 100%;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: var(--background);
        }

        .premium-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .cover-overlay {
            position: absolute;
            z-index: 1;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse 90% 45% at 50% 100%,
                    rgba(254, 254, 254, 0.40) 0%,
                    rgba(254, 254, 254, 0.24) 34%,
                    rgba(254, 254, 254, 0.09) 58%,
                    rgba(254, 254, 254, 0) 78%
                ),
                linear-gradient(
                    to bottom,
                    rgba(254, 254, 254, 0) 24%,
                    rgba(254, 254, 254, 0.02) 40%,
                    rgba(254, 254, 254, 0.08) 52%,
                    rgba(254, 254, 254, 0.18) 63%,
                    rgba(254, 254, 254, 0.38) 73%,
                    rgba(254, 254, 254, 0.68) 84%,
                    rgba(254, 254, 254, 0.92) 94%,
                    rgba(254, 254, 254, 1) 100%
                );
        }

        .cover-invitation {
            position: absolute;
            z-index: 2;
            right: 28px;
            bottom: 12px;
            left: 28px;
            color: var(--bordeaux);
            text-align: center;
        }

        .cover-invitation p {
            max-width: 620px;
            margin: 0 auto 12px;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(15px, 1.25vw, 19px);
            font-weight: 300;
            line-height: 1.55;
            letter-spacing: 0.02em;
            text-shadow: none;
        }

        .cover-invitation p::after {
            display: block;
            width: 120px;
            height: 1px;
            margin: 12px auto 0;
            background: rgba(99, 9, 9, 0.45);
            content: "";
        }

        .open-album {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2.6px;
            text-decoration: none;
            text-transform: uppercase;
            text-shadow: none;
        }

        .open-album::after {
            font-size: 14px;
            content: "→";
            transition: transform 0.25s ease;
        }

        .open-album:hover::after {
            transform: translateX(5px);
        }

        .page-shell {
            opacity: 1;
            transform: translateX(0);
            transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1), opacity 400ms ease;
            will-change: transform, opacity;
        }

        body.page-leaving .page-shell {
            opacity: 0;
            transform: translateX(-34px);
        }

        @media (min-width: 721px) and (max-height: 820px) {
            .sidebar-inner { padding-top: 10px; padding-bottom: 16px; }
            .wedding-logo { width: 88px; margin-bottom: 8px; }
            .page-item:not(.page-item-separated) { margin-bottom: 2px; }
            .page-link { min-height: 37px; font-size: 12.5px; }
            .page-dot { width: 28px; height: 28px; font-size: 9.5px; }
            .page-list::before { left: 13px; }
            .menu-annexe { padding-top: 10px; }
            .menu-annexe-line { margin-bottom: 10px; }
            .menu-annexe-title { padding-left: 44px; font-size: 8px; }
        }

        /* =========================
           TABLETTE ET MOBILE
        ========================= */

        .mobile-menu-button {
            display: none;
        }

        @media (max-width: 900px) {
            :root {
                --sidebar-width: 250px;
            }

    
        .sidebar-inner {
                padding-right: 18px;
                padding-left: 18px;
            }

            .premium-photo-wrap {
                height: 100vh;
            }
        }

        @media (max-width: 720px) {
            :root {
                --sidebar-width: 0px;
            }

            .mobile-menu-button {
                position: fixed;
                z-index: 1400;
                top: 14px;
                left: 14px;
                display: inline-grid;
                width: 44px;
                height: 44px;
                place-items: center;
                border: 1px solid rgba(99, 9, 9, 0.20);
                border-radius: 50%;
                background: rgba(254, 254, 254, 0.98);
                color: var(--bordeaux);
                font-size: 19px;
                box-shadow: 0 8px 24px rgba(53, 36, 31, 0.10);
            }

            .book-sidebar {
                width: min(88vw, 330px);
                transform: translateX(-105%);
                transition: transform 0.3s ease;
            }

            .book-sidebar.is-open {
                transform: translateX(0);
            }

            .page-shell {
                margin-left: 0;
            }

            .premium-photo-wrap {
                height: 100svh;
            }

            .cover-invitation {
                right: 16px;
                bottom: 10px;
                left: 16px;
            }

            .cover-invitation p {
                margin-bottom: 6px;
                font-size: clamp(14px, 3.8vw, 17px);
                line-height: 1.4;
            }

            .open-album {
                font-size: 9px;
                letter-spacing: 1.7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <button
        class="mobile-menu-button"
        type="button"
        aria-label="Ouvrir le sommaire"
        aria-controls="book-sidebar"
        aria-expanded="false"
    >
        ☰
    </button>

    <aside
        class="book-sidebar"
        id="book-sidebar"
        aria-label="Pages de l’album"
    >

        <div class="sidebar-inner">

            <img
                src="images/style/logosansfond.jpg"
                alt="Logo du mariage d’Élodie et Alexandre"
                class="wedding-logo"
            >

            <nav aria-label="Navigation principale">

                <ol class="page-list">

                    <li class="page-item">
                        <a href="./" class="page-link" data-page="bienvenue">
                            <span class="page-dot">1</span>
                            <span class="page-label">Bienvenue</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="sommaire/" class="page-link" data-page="sommaire">
                            <span class="page-dot">2</span>
                            <span class="page-label">Sommaire</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="invitation/" class="page-link" data-page="invitation">
                            <span class="page-dot">3</span>
                            <span class="page-label">Invitation</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="preparatifs/" class="page-link" data-page="preparatifs">
                            <span class="page-dot">4</span>
                            <span class="page-label">Préparatifs</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="first-look/" class="page-link" data-page="first-look">
                            <span class="page-dot">5</span>
                            <span class="page-label">First Look</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="mairie/" class="page-link" data-page="mairie">
                            <span class="page-dot">6</span>
                            <span class="page-label">Mairie</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="eglise/" class="page-link" data-page="eglise">
                            <span class="page-dot">7</span>
                            <span class="page-label">Église</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="vin_d_honneur/" class="page-link" data-page="vin-d-honneur">
                            <span class="page-dot">8</span>
                            <span class="page-label">Vin d’honneur</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="soiree/" class="page-link" data-page="soiree">
                            <span class="page-dot">9</span>
                            <span class="page-label">Soirée</span>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="remerciements/" class="page-link" data-page="remerciements">
                            <span class="page-dot">10</span>
                            <span class="page-label">Remerciements</span>
                        </a>
                    </li>
                    <li class="menu-annexe" aria-hidden="true">
                        <span class="menu-annexe-line"></span>
                        <span class="menu-annexe-title">À revivre</span>
                    </li>
                    <li class="page-item page-item-separated">
                        <a href="souvenirs/" class="page-link" data-page="souvenirs">
                            <span class="page-dot">11</span>
                            <span class="page-label">Souvenirs</span>
                        </a>
                    </li>

                </ol>

            </nav>

        </div>

    </aside>

    <main class="page-shell">

        <section class="cover">

            <div class="cover-content">

                <figure class="premium-photo-wrap">

                    <img
                        src="images/vignettes/PAGEACCUEIL.jpg"
                        alt="Couverture de l’album du mariage d’Élodie et Alexandre"
                        class="premium-photo"
                    >

                    <div class="cover-overlay" aria-hidden="true"></div>

                    <figcaption class="cover-invitation">
                        <p>
                            Replongez avec nous dans les souvenirs de cette journée inoubliable.
                        </p>

                        <a href="sommaire/" class="open-album">
                            Découvrir l’album
                        </a>
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>

    <script>
        const currentPage = "bienvenue";

        const pageOrder = [
            "bienvenue",
            "sommaire",
            "invitation",
            "preparatifs",
            "first-look",
            "mairie",
            "eglise",
            "vin-d-honneur",
            "soiree",
            "remerciements",
            "souvenirs"
        ];

        const currentIndex = pageOrder.indexOf(currentPage);

        document.querySelectorAll(".page-link").forEach((link) => {
            const pageName = link.dataset.page;
            const pageIndex = pageOrder.indexOf(pageName);

            link.classList.remove("is-current", "is-visited");
            link.removeAttribute("aria-current");

            if (pageIndex < currentIndex) {
                link.classList.add("is-visited");
            }

            if (pageName === currentPage) {
                link.classList.add("is-current");
                link.setAttribute("aria-current", "page");
            }
        });

        const menuButton = document.querySelector(".mobile-menu-button");
        const sidebar = document.querySelector(".book-sidebar");

        menuButton.addEventListener("click", () => {
            const isOpen = sidebar.classList.toggle("is-open");
            menuButton.setAttribute("aria-expanded", String(isOpen));
            menuButton.textContent = isOpen ? "×" : "☰";
        });

        document.addEventListener("click", (event) => {
            const clickedInsideSidebar = sidebar.contains(event.target);
            const clickedMenuButton = menuButton.contains(event.target);

            if (
                window.innerWidth <= 720 &&
                sidebar.classList.contains("is-open") &&
                !clickedInsideSidebar &&
                !clickedMenuButton
            ) {
                sidebar.classList.remove("is-open");
                menuButton.setAttribute("aria-expanded", "false");
                menuButton.textContent = "☰";
            }
        });

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        document.querySelectorAll('a[href]').forEach((link) => {
            link.addEventListener("click", (event) => {
                const href = link.getAttribute("href");
                if (prefersReducedMotion || !href || href.startsWith("#") || link.target === "_blank" || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
                const destination = new URL(link.href, window.location.href);
                if (destination.origin !== window.location.origin) return;
                event.preventDefault();
                document.body.classList.add("page-leaving");
                window.setTimeout(() => { window.location.href = destination.href; }, 400);
            });
        });

    </script>

</body>

</html>
