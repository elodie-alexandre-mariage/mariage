<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Les photos prises par les invités au mariage d’Élodie et Alexandre, le 23 mai 2026."
    >

    <title>Vos photos — Élodie & Alexandre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="preload"
        as="image"
        href="../images/vos_photos/vos_photos_firstlook_0001.jpg"
        fetchpriority="high"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --white: #ffffff;
            --background: #fefefe;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        body.lightbox-open {
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        button {
            font: inherit;
        }

        .page-shell {
            min-height: 100vh;
            opacity: 1;
            transform: translateX(0);
            transition:
                transform 400ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 400ms ease;
            will-change: transform, opacity;
        }

        body.page-leaving .page-shell {
            opacity: 0;
            transform: translateX(-34px);
        }

        /* =========================
           EN-TÊTE
        ========================= */

        .hero {
            padding: 58px 30px 52px;
            background: var(--background);
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 14px;
            color: rgba(99, 9, 9, 0.72);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.30em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(26px, 2.2vw, 30px);
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1::after {
            display: block;
            width: 88px;
            height: 1px;
            margin: 18px auto 0;
            background: rgba(99, 9, 9, 0.48);
            content: "";
        }

        .intro {
            max-width: 680px;
            margin: 18px auto 0;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            letter-spacing: 0.04em;
        }

        /* =========================
           NAVIGATION DES SOUVENIRS
        ========================= */

        .souvenir-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            padding: 22px 40px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: var(--white);
        }

        .souvenir-nav-back {
            justify-self: start;
        }

        .souvenir-nav-pages {
            display: flex;
            grid-column: 3;
            justify-self: end;
            gap: 10px;
        }

        .souvenir-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 1px solid rgba(99, 9, 9, 0.24);
            border-radius: 999px;
            background: var(--white);
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-decoration: none;
            text-transform: uppercase;
            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .souvenir-link:hover,
        .souvenir-link:focus-visible {
            border-color: var(--bordeaux);
            background: var(--bordeaux);
            color: var(--white);
            transform: translateY(-2px);
        }



        /* =========================
           ICÔNES DE NAVIGATION
        ========================= */

        .souvenir-link {
            gap: 10px;
        }

        .souvenir-link-icon {
            display: inline-flex;
            width: 18px;
            height: 12px;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            color: currentColor;
            opacity: 0.86;
            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .souvenir-link-icon svg {
            width: 18px;
            height: 12px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.45;
        }

        .souvenir-link:hover .souvenir-link-icon,
        .souvenir-link:focus-visible .souvenir-link-icon {
            opacity: 1;
        }

        .souvenir-link:hover .souvenir-link-icon.is-previous,
        .souvenir-link:focus-visible .souvenir-link-icon.is-previous,
        .souvenir-link:hover .souvenir-link-icon.is-return,
        .souvenir-link:focus-visible .souvenir-link-icon.is-return {
            transform: translateX(-4px);
        }

        .souvenir-link:hover .souvenir-link-icon.is-next,
        .souvenir-link:focus-visible .souvenir-link-icon.is-next {
            transform: translateX(4px);
        }

        /* =========================
           GALERIE
        ========================= */

        .gallery-section {
            padding: 48px 40px 72px;
            background: var(--soft);
        }

        .gallery-heading {
            display: grid;
            width: 100%;
            max-width: 1180px;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: end;
            gap: 30px;
            margin: 0 auto 26px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(99, 9, 9, 0.16);
        }

        .gallery-heading p {
            justify-self: start;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .gallery-heading h2 {
            justify-self: end;
            max-width: 540px;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.65;
            text-align: right;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 11px;
            max-width: 1180px;
            margin: auto;
        }

        .gallery-moment + .gallery-moment {
            margin-top: 58px;
        }

        .gallery-item {
            position: relative;
            display: block;
            overflow: hidden;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #e9e3df;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 280px 280px;
        }

        .gallery-item::after {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.26);
            content: "";
            pointer-events: none;
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            filter: saturate(0.86) contrast(0.98);
            backface-visibility: hidden;
            transform: translateZ(0);
            transition:
                transform 0.65s ease,
                filter 0.45s ease;
            will-change: transform, filter;
        }

        .gallery-item:hover img {
            filter: saturate(1.03) contrast(1.01);
            transform: translateZ(0) scale(1.045);
        }

        .gallery-item:focus-visible {
            outline: 2px solid var(--bordeaux);
            outline-offset: 4px;
        }

        /* =========================
           PIED DE PAGE
        ========================= */

        .footer {
            padding: 12px 20px 16px;
            background: var(--background);
            text-align: center;
        }

        .footer-name-logo {
            width: 145px;
            max-width: 48vw;
            height: auto;
            margin: 0 auto;
        }

        .footer-date-logo {
            width: 110px;
            max-width: 28vw;
            height: auto;
            margin: 5px auto 0;
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 34px 95px;
            background: rgba(15, 12, 11, 0.96);
            opacity: 0;
            visibility: hidden;
            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .lightbox.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-image {
            max-width: 90vw;
            max-height: 86vh;
            object-fit: contain;
            box-shadow: 0 15px 55px rgba(0, 0, 0, 0.35);
            transform: scale(0.985);
            transition: transform 0.25s ease;
        }

        .lightbox.open .lightbox-image {
            transform: scale(1);
        }

        .lightbox-close,
        .lightbox-arrow {
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .lightbox-close {
            position: fixed;
            top: 22px;
            right: 28px;
            z-index: 2002;
            display: flex;
            width: 46px;
            height: 46px;
            align-items: center;
            justify-content: center;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 29px;
            font-weight: 200;
            line-height: 1;
        }

        .lightbox-close:hover,
        .lightbox-close:focus-visible {
            background: rgba(255, 255, 255, 0.17);
            transform: rotate(4deg);
        }

        .lightbox-arrow {
            position: fixed;
            top: 50%;
            z-index: 2001;
            display: flex;
            width: 52px;
            height: 52px;
            align-items: center;
            justify-content: center;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 31px;
            font-weight: 200;
            transform: translateY(-50%);
        }

        .lightbox-arrow:hover,
        .lightbox-arrow:focus-visible {
            background: rgba(255, 255, 255, 0.20);
        }

        .previous {
            left: 28px;
        }

        .previous:hover {
            transform: translate(-3px, -50%);
        }

        .next {
            right: 28px;
        }

        .next:hover {
            transform: translate(3px, -50%);
        }

        .photo-counter {
            position: fixed;
            bottom: 22px;
            left: 50%;
            z-index: 2002;
            color: rgba(255, 255, 255, 0.76);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            transform: translateX(-50%);
        }

        @media (max-width: 1020px) {
            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .hero {
                padding: 72px 20px 48px;
            }

            .souvenir-nav {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 20px 16px;
            }

            .souvenir-nav-back,
            .souvenir-nav-pages {
                width: 100%;
                grid-column: 1;
                justify-self: stretch;
            }

            .souvenir-nav-pages {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .souvenir-link {
                width: 100%;
            }

            .gallery-section {
                padding: 42px 10px 56px;
            }

            .gallery-heading {
                grid-template-columns: 1fr;
                gap: 9px;
                margin-bottom: 22px;
                padding: 0 10px 14px;
            }

            .gallery-heading h2 {
                justify-self: start;
                text-align: left;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 7px;
            }

            .gallery-moment + .gallery-moment {
                margin-top: 42px;
            }

            .lightbox {
                padding: 70px 12px 65px;
            }

            .lightbox-image {
                max-width: 96vw;
                max-height: 79vh;
            }

            .lightbox-close {
                top: 14px;
                right: 14px;
                width: 42px;
                height: 42px;
            }

            .lightbox-arrow {
                top: auto;
                bottom: 14px;
                width: 44px;
                height: 44px;
                transform: none;
            }

            .previous {
                left: 15px;
            }

            .next {
                right: 15px;
            }

            .previous:hover {
                transform: translateX(-2px);
            }

            .next:hover {
                transform: translateX(2px);
            }

            .photo-counter {
                bottom: 29px;
            }
        }

        @media (hover: none) {
            .gallery-item:hover img {
                filter: saturate(0.86) contrast(0.98);
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <link rel="stylesheet" href="../components/menu-lateral.css?v=42">
    <script src="../components/menu-lateral.js?v=42" defer></script>
</head>

<body>

    <main class="page-shell">

        <section class="hero">

            <p class="eyebrow">À travers vos regards</p>

            <h1>Vos photos</h1>

            <p class="intro">
                Les images prises par nos invités, réunies dans l’ordre de cette journée :
                du first look jusqu’à la soirée.
            </p>

        </section>

        <nav
            class="souvenir-nav"
            aria-label="Navigation entre les souvenirs"
        >
            <a
                href="../souvenirs/"
                class="souvenir-link souvenir-nav-back"
            >
                <span
                    class="souvenir-link-icon is-return"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 16">
                        <path d="M8.5 3 3.5 8l5 5"></path>
                        <path d="M4 8h9.5c3.1 0 5.5 2.2 5.5 5"></path>
                    </svg>
                </span>
                <span>Retour aux souvenirs</span>
            </a>

            <div class="souvenir-nav-pages">
                <a
                    href="../videos/"
                    class="souvenir-link"
                >
                    <span
                        class="souvenir-link-icon is-previous"
                        aria-hidden="true"
                    >
                        <svg viewBox="0 0 24 16">
                            <path d="m8 3-5 5 5 5"></path>
                            <path d="M4 8h16"></path>
                        </svg>
                    </span>
                    <span>Film &amp; vidéos</span>
                </a>
            </div>
        </nav>

        <section
            class="gallery-section"
            aria-label="Photos prises par nos invités"
        >

            <div class="gallery-moment">
                <div class="gallery-heading">
                    <p>First look</p>
                    <h2>1 photo</h2>
                </div>

                <div
                    class="gallery"
                    id="gallery-firstlook"
                    aria-live="off"
                ></div>
            </div>

            <div class="gallery-moment">
                <div class="gallery-heading">
                    <p>Mairie</p>
                    <h2>66 photos</h2>
                </div>

                <div
                    class="gallery"
                    id="gallery-mairie"
                    aria-live="off"
                ></div>
            </div>

            <div class="gallery-moment">
                <div class="gallery-heading">
                    <p>Église</p>
                    <h2>124 photos</h2>
                </div>

                <div
                    class="gallery"
                    id="gallery-eglise"
                    aria-live="off"
                ></div>
            </div>

            <div class="gallery-moment">
                <div class="gallery-heading">
                    <p>Vin d’honneur</p>
                    <h2>52 photos</h2>
                </div>

                <div
                    class="gallery"
                    id="gallery-vin-d-honneur"
                    aria-live="off"
                ></div>
            </div>

            <div class="gallery-moment">
                <div class="gallery-heading">
                    <p>Soirée</p>
                    <h2>14 photos</h2>
                </div>

                <div
                    class="gallery"
                    id="gallery-soiree"
                    aria-live="off"
                ></div>
            </div>

        </section>

        <footer class="footer" aria-label="Signature de l’album">

            <img
                src="../images/style/nomsansfond.jpg"
                alt="Élodie et Alexandre"
                class="footer-name-logo"
                loading="lazy"
                decoding="async"
            >

            <img
                src="../images/style/datesansfond.jpg"
                alt="23 mai 2026"
                class="footer-date-logo"
                loading="lazy"
                decoding="async"
            >

        </footer>

    </main>

    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Agrandissement de la photographie"
        aria-hidden="true"
    >

        <button
            type="button"
            class="lightbox-close"
            id="closeButton"
            aria-label="Fermer la photographie"
        >
            ×
        </button>

        <button
            type="button"
            class="lightbox-arrow previous"
            id="previousButton"
            aria-label="Photographie précédente"
        >
            ‹
        </button>

        <img
            class="lightbox-image"
            id="lightboxImage"
            src=""
            alt="Photos prises par les invités au mariage d’Élodie et Alexandre"
        >

        <button
            type="button"
            class="lightbox-arrow next"
            id="nextButton"
            aria-label="Photographie suivante"
        >
            ›
        </button>

        <p
            class="photo-counter"
            id="photoCounter"
            aria-live="polite"
        ></p>

    </div>

    <script>
        const galleryGroups = [
            {
                id: "gallery-firstlook",
                prefix: "vos_photos_firstlook_",
                total: 1,
                label: "First look"
            },
            {
                id: "gallery-mairie",
                prefix: "vos_photos_mairie_",
                total: 66,
                label: "Mairie"
            },
            {
                id: "gallery-eglise",
                prefix: "vos_photos_eglise_",
                total: 124,
                label: "Église"
            },
            {
                id: "gallery-vin-d-honneur",
                prefix: "vos_photos_vin_d_honneur_",
                total: 52,
                label: "Vin d’honneur"
            },
            {
                id: "gallery-soiree",
                prefix: "vos_photos_soiree_",
                total: 14,
                label: "Soirée"
            }
        ];

        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const photoCounter = document.getElementById("photoCounter");
        const closeButton = document.getElementById("closeButton");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");

        let currentImage = 0;
        let previousFocusedElement = null;
        let touchStartX = 0;
        let touchEndX = 0;

        function formatPhotoNumber(number) {
            return String(number).padStart(4, "0");
        }

        function getPhotoPath(prefix, number) {
            return (
                "../images/vos_photos/" +
                prefix +
                formatPhotoNumber(number) +
                ".jpg"
            );
        }

        const photos = [];

        galleryGroups.forEach(function(group) {
            for (let number = 1; number <= group.total; number += 1) {
                photos.push({
                    path: getPhotoPath(group.prefix, number),
                    label: group.label
                });
            }
        });

        let globalIndex = 0;

        galleryGroups.forEach(function(group) {
            const gallery = document.getElementById(group.id);
            const fragment = document.createDocumentFragment();

            for (let number = 1; number <= group.total; number += 1) {
                const currentGlobalIndex = globalIndex;
                const button = document.createElement("button");
                const image = document.createElement("img");
                const photo = photos[currentGlobalIndex];

                button.type = "button";
                button.className = "gallery-item";
                button.setAttribute(
                    "aria-label",
                    "Agrandir la photographie " +
                    (currentGlobalIndex + 1) +
                    " sur " +
                    photos.length
                );

                image.src = photo.path;
                image.alt =
                    photo.label +
                    " — photographie " +
                    number +
                    " sur " +
                    group.total;

                image.decoding = "async";

                if (currentGlobalIndex < 8) {
                    image.loading = "eager";
                } else {
                    image.loading = "lazy";
                }

                if (currentGlobalIndex === 0) {
                    image.fetchPriority = "high";
                }

                button.appendChild(image);

                button.addEventListener("click", function() {
                    openLightbox(currentGlobalIndex);
                });

                fragment.appendChild(button);
                globalIndex += 1;
            }

            gallery.appendChild(fragment);
        });

        function preloadAdjacentImages() {
            const previousIndex =
                (currentImage - 1 + photos.length) % photos.length;

            const nextIndex =
                (currentImage + 1) % photos.length;

            [previousIndex, nextIndex].forEach(function(index) {
                const preloadImage = new Image();
                preloadImage.src = photos[index].path;
            });
        }

        function updateLightbox() {
            const photo = photos[currentImage];

            lightboxImage.src = photo.path;
            lightboxImage.alt =
                photo.label +
                " — photographie " +
                (currentImage + 1) +
                " sur " +
                photos.length;

            photoCounter.textContent =
                (currentImage + 1) +
                " / " +
                photos.length;

            preloadAdjacentImages();
        }

        function openLightbox(index) {
            previousFocusedElement = document.activeElement;
            currentImage = index;

            updateLightbox();

            lightbox.classList.add("open");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.classList.add("lightbox-open");

            closeButton.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightbox.setAttribute("aria-hidden", "true");
            document.body.classList.remove("lightbox-open");

            lightboxImage.src = "";

            if (previousFocusedElement) {
                previousFocusedElement.focus();
            }
        }

        function changeImage(direction) {
            currentImage =
                (currentImage + direction + photos.length) %
                photos.length;

            updateLightbox();
        }

        closeButton.addEventListener("click", closeLightbox);

        previousButton.addEventListener("click", function() {
            changeImage(-1);
        });

        nextButton.addEventListener("click", function() {
            changeImage(1);
        });

        lightbox.addEventListener("click", function(event) {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        lightbox.addEventListener(
            "touchstart",
            function(event) {
                touchStartX = event.changedTouches[0].screenX;
            },
            { passive: true }
        );

        lightbox.addEventListener(
            "touchend",
            function(event) {
                touchEndX = event.changedTouches[0].screenX;

                const distance = touchEndX - touchStartX;

                if (Math.abs(distance) < 55) {
                    return;
                }

                changeImage(distance > 0 ? -1 : 1);
            },
            { passive: true }
        );

        document.addEventListener("keydown", function(event) {
            if (!lightbox.classList.contains("open")) {
                return;
            }

            if (event.key === "Escape") {
                closeLightbox();
            }

            if (event.key === "ArrowLeft") {
                changeImage(-1);
            }

            if (event.key === "ArrowRight") {
                changeImage(1);
            }

            if (event.key === "Tab") {
                const focusableElements = [
                    closeButton,
                    previousButton,
                    nextButton
                ];

                const currentFocusIndex =
                    focusableElements.indexOf(document.activeElement);

                if (event.shiftKey && currentFocusIndex <= 0) {
                    event.preventDefault();
                    nextButton.focus();
                } else if (
                    !event.shiftKey &&
                    currentFocusIndex === focusableElements.length - 1
                ) {
                    event.preventDefault();
                    closeButton.focus();
                }
            }
        });
    </script>

</body>
</html>
