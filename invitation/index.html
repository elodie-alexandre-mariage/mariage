<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Les faire-part du mariage d’Élodie et Alexandre, célébré le 23 mai 2026."
    >

    <title>L’invitation — Élodie & Alexandre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --paper: #fffefa;
            --envelope: #f3eee8;
            --envelope-light: #faf7f2;
            --envelope-shadow: #ded3c8;
            --background: #fefefe;
            --handwriting:
                "Segoe Script",
                "Lucida Handwriting",
                "Brush Script MT",
                "Snell Roundhand",
                cursive;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        body.lightbox-open {
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button {
            font: inherit;
        }

        /* =========================
           EN-TÊTE
        ========================= */

        .hero {
            padding: 58px 30px 52px;
            background: var(--background);
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 14px;
            color: rgba(99, 9, 9, 0.72);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.30em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(26px, 2.2vw, 30px);
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1::after {
            display: block;
            width: 88px;
            height: 1px;
            margin: 18px auto 0;
            background: rgba(99, 9, 9, 0.48);
            content: "";
        }

        .intro {
            max-width: 700px;
            margin: 18px auto 0;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            letter-spacing: 0.04em;
        }

        /* =========================
           PAGE DES INVITATIONS
        ========================= */

        .invitations-page {
            padding: 64px 30px 92px;
            border-top: 1px solid var(--line);
            background: var(--soft);
        }

        .invitations-inner {
            width: min(100%, 1040px);
            margin: 0 auto;
        }

        .invitation-block {
            margin-bottom: 100px;
            text-align: center;
        }

        .invitation-block:last-child {
            margin-bottom: 0;
        }

        .block-title {
            margin-bottom: 34px;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        /* =========================
           SCÈNE DE L’ENVELOPPE
        ========================= */

        .envelope-viewer {
            width: min(100%, 780px);
            margin: 0 auto;
        }

        .envelope-viewer.is-square {
            width: min(100%, 570px);
        }

        .envelope-scene {
            position: relative;
            width: 100%;
            min-height: 610px;
            perspective: 1500px;
        }

        .envelope-viewer.is-square .envelope-scene {
            min-height: 650px;
        }

        .envelope-shell {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            height: 61%;
            margin: 0 auto;
            filter: drop-shadow(0 22px 30px rgba(55, 40, 36, 0.14));
        }

        .envelope-viewer.is-square .envelope-shell {
            width: min(92%, 515px);
            height: 68%;
        }

        .envelope-viewer.is-rectangle .envelope-shell {
            width: min(96%, 760px);
            height: 56%;
        }

        /* Dos de l’enveloppe */
        .envelope-back {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            border: 1px solid rgba(99, 9, 9, 0.11);
            border-radius: 8px;
            background:
                linear-gradient(
                    145deg,
                    var(--envelope-light) 0%,
                    var(--envelope) 62%,
                    #ebe3db 100%
                );
        }

        /* Le faire-part est entièrement caché au repos */
        .invitation-card {
            position: absolute;
            z-index: 2;
            left: 50%;
            display: block;
            overflow: hidden;
            padding: 9px;
            border: 1px solid rgba(99, 9, 9, 0.11);
            border-radius: 2px;
            background:
                linear-gradient(145deg, #ffffff, #fffdf9);
            box-shadow:
                0 14px 34px rgba(55, 40, 36, 0.13),
                0 2px 5px rgba(55, 40, 36, 0.06);
            cursor: zoom-in;
            opacity: 0;
            transform: translateX(-50%) translateY(28%) scale(0.965);
            transform-origin: 50% 50%;
            will-change: transform, opacity;
        }

        .invitation-card::before {
            position: absolute;
            inset: 9px;
            z-index: 2;
            border: 1px solid rgba(99, 9, 9, 0.035);
            content: "";
            pointer-events: none;
        }

        .envelope-viewer.is-square .invitation-card {
            bottom: 6%;
            width: 78%;
            aspect-ratio: 1 / 1;
        }

        .envelope-viewer.is-rectangle .invitation-card {
            bottom: 7%;
            width: 88%;
            aspect-ratio: 3 / 2;
        }

        .invitation-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 450ms ease;
        }

        .invitation-card:hover img {
            transform: scale(1.008);
        }

        .envelope-viewer.is-open .invitation-card {
            z-index: 12;
            opacity: 1;
            box-shadow:
                0 36px 78px rgba(55, 40, 36, 0.23),
                0 9px 22px rgba(55, 40, 36, 0.11);
        }

        .envelope-viewer.is-square.is-open .invitation-card {
            animation:
                extract-square-card 1050ms
                cubic-bezier(0.22, 1, 0.36, 1)
                300ms both;
        }

        .envelope-viewer.is-rectangle.is-open .invitation-card {
            animation:
                extract-rectangle-card 1050ms
                cubic-bezier(0.22, 1, 0.36, 1)
                300ms both;
        }

        .envelope-viewer.is-square.is-closing .invitation-card {
            animation:
                return-square-card 760ms
                cubic-bezier(0.4, 0, 0.2, 1)
                both;
        }

        .envelope-viewer.is-rectangle.is-closing .invitation-card {
            animation:
                return-rectangle-card 760ms
                cubic-bezier(0.4, 0, 0.2, 1)
                both;
        }

        @keyframes extract-square-card {
            0% {
                z-index: 2;
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(28%)
                    scale(0.965);
            }

            42% {
                z-index: 2;
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-43%)
                    scale(0.99)
                    rotate(-0.45deg);
            }

            43% {
                z-index: 12;
            }

            72% {
                z-index: 12;
                transform:
                    translateX(-50%)
                    translateY(-32%)
                    scale(1.028)
                    rotate(0.22deg);
            }

            100% {
                z-index: 12;
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-25%)
                    scale(1.04)
                    rotate(0);
            }
        }

        @keyframes extract-rectangle-card {
            0% {
                z-index: 2;
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(28%)
                    scale(0.965);
            }

            42% {
                z-index: 2;
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-19%)
                    scale(0.99)
                    rotate(-0.28deg);
            }

            43% {
                z-index: 12;
            }

            72% {
                z-index: 12;
                transform:
                    translateX(-50%)
                    translateY(-10%)
                    scale(1.025)
                    rotate(0.14deg);
            }

            100% {
                z-index: 12;
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-5%)
                    scale(1.035)
                    rotate(0);
            }
        }

        @keyframes return-square-card {
            0% {
                z-index: 12;
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-25%)
                    scale(1.04);
            }

            48% {
                z-index: 12;
                transform:
                    translateX(-50%)
                    translateY(-43%)
                    scale(0.99);
            }

            49% {
                z-index: 2;
            }

            100% {
                z-index: 2;
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(28%)
                    scale(0.965);
            }
        }

        @keyframes return-rectangle-card {
            0% {
                z-index: 12;
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-5%)
                    scale(1.035);
            }

            48% {
                z-index: 12;
                transform:
                    translateX(-50%)
                    translateY(-19%)
                    scale(0.99);
            }

            49% {
                z-index: 2;
            }

            100% {
                z-index: 2;
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(28%)
                    scale(0.965);
            }
        }

        /* Poche avant */
        .envelope-front {
            position: absolute;
            inset: 0;
            z-index: 4;
            overflow: hidden;
            border: 1px solid rgba(99, 9, 9, 0.10);
            border-radius: 8px;
            background: var(--envelope);
            cursor: pointer;
            transition:
                transform 650ms cubic-bezier(0.22, 1, 0.36, 1) 540ms,
                filter 450ms ease 540ms,
                opacity 450ms ease 540ms;
        }

        .envelope-front::before,
        .envelope-front::after {
            position: absolute;
            bottom: 0;
            width: 70%;
            height: 100%;
            background:
                linear-gradient(
                    165deg,
                    rgba(255, 255, 255, 0.25),
                    transparent 48%
                ),
                var(--envelope);
            content: "";
        }

        .envelope-front::before {
            left: 0;
            clip-path: polygon(0 0, 100% 58%, 100% 100%, 0 100%);
        }

        .envelope-front::after {
            right: 0;
            clip-path: polygon(100% 0, 0 58%, 0 100%, 100% 100%);
        }

        .envelope-bottom-fold {
            position: absolute;
            inset: 0;
            z-index: 5;
            clip-path: polygon(0 100%, 50% 43%, 100% 100%);
            background:
                linear-gradient(
                    180deg,
                    var(--envelope-shadow),
                    var(--envelope) 72%
                );
            pointer-events: none;
            transition:
                transform 650ms cubic-bezier(0.22, 1, 0.36, 1) 540ms,
                filter 450ms ease 540ms,
                opacity 450ms ease 540ms;
        }

        /* Rabat supérieur */
        .envelope-flap {
            position: absolute;
            z-index: 6;
            top: 0;
            right: 0;
            left: 0;
            height: 63%;
            border-radius: 8px 8px 0 0;
            background:
                linear-gradient(
                    180deg,
                    var(--envelope-light),
                    #ebe3db
                );
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: 50% 0;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            transition:
                transform 560ms cubic-bezier(0.4, 0, 0.2, 1),
                filter 350ms ease;
            pointer-events: none;
        }

        .envelope-flap::after {
            position: absolute;
            inset: 0;
            border-top: 1px solid rgba(99, 9, 9, 0.08);
            content: "";
        }

        .envelope-viewer.is-open .envelope-flap {
            filter: brightness(0.985);
            transform: rotateX(180deg);
        }

        .envelope-viewer.is-open .envelope-front,
        .envelope-viewer.is-open .envelope-bottom-fold {
            filter: brightness(0.975);
            opacity: 0.93;
            transform: translateY(14px) scale(0.985);
        }

        .envelope-viewer.is-closing .envelope-front,
        .envelope-viewer.is-closing .envelope-bottom-fold {
            transition-delay: 0ms;
            transform: translateY(0) scale(1);
        }

        .envelope-viewer.is-closing .envelope-flap {
            filter: brightness(1);
            transform: rotateX(0);
            transition-delay: 390ms;
        }

        /* Bouton invisible couvrant l’enveloppe */
        .envelope-trigger {
            position: absolute;
            inset: 0;
            z-index: 8;
            border: 0;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .envelope-viewer.is-open .envelope-trigger {
            z-index: 3;
        }

        /* Texte manuscrit */
        .envelope-address {
            position: absolute;
            z-index: 7;
            right: 10%;
            bottom: 16%;
            left: 10%;
            color: var(--bordeaux);
            font-family: var(--handwriting);
            text-align: center;
            pointer-events: none;
            transition:
                opacity 250ms ease,
                transform 350ms ease;
        }

        .envelope-address strong {
            display: block;
            font-size: clamp(25px, 3.4vw, 34px);
            font-weight: 400;
            line-height: 1.05;
        }

        .envelope-address span {
            display: block;
            margin-top: 9px;
            font-size: clamp(15px, 2.1vw, 20px);
            font-weight: 400;
            line-height: 1.3;
        }

        .envelope-viewer.is-open .envelope-address {
            opacity: 0;
            transform: translateY(8px);
        }

        /* =========================
           COMMANDES
        ========================= */

        .interaction-hint {
            margin-top: 18px;
            color: rgba(99, 9, 9, 0.58);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .face-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            visibility: hidden;
            margin-top: 18px;
            opacity: 0;
            transform: translateY(-7px);
            transition:
                opacity 280ms ease 520ms,
                transform 280ms ease 520ms,
                visibility 0ms linear 800ms;
        }

        .envelope-viewer.is-open .face-controls {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            transition-delay: 520ms;
        }

        .face-button,
        .close-envelope {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 180ms ease;
        }

        .face-button:hover,
        .face-button.is-active,
        .close-envelope:hover {
            color: var(--bordeaux);
        }

        .control-line {
            width: 24px;
            height: 1px;
            background: rgba(99, 9, 9, 0.23);
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            padding: 34px 95px;
            background: rgba(15, 12, 11, 0.96);
            opacity: 0;
            transition:
                opacity 250ms ease,
                visibility 250ms ease;
        }

        .lightbox.open {
            visibility: visible;
            opacity: 1;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 86vh;
            object-fit: contain;
            box-shadow: 0 15px 55px rgba(0, 0, 0, 0.35);
        }

        .lightbox-close,
        .lightbox-arrow {
            position: fixed;
            z-index: 2002;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            cursor: pointer;
        }

        .lightbox-close {
            top: 22px;
            right: 28px;
            width: 46px;
            height: 46px;
            font-size: 28px;
        }

        .lightbox-arrow {
            top: 50%;
            width: 50px;
            height: 50px;
            font-size: 29px;
            transform: translateY(-50%);
        }

        .lightbox-previous {
            left: 28px;
        }

        .lightbox-next {
            right: 28px;
        }

        /* =========================
           PIED DE PAGE
        ========================= */

        .footer {
            padding: 12px 20px 16px;
            background: var(--background);
            text-align: center;
        }

        .footer-name-logo {
            width: 145px;
            max-width: 48vw;
            height: auto;
            margin: 0 auto;
        }

        .footer-date-logo {
            width: 110px;
            max-width: 28vw;
            height: auto;
            margin: 5px auto 0;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 720px) {
            .hero {
                padding: 72px 20px 48px;
            }

            .invitations-page {
                padding: 42px 12px 66px;
            }

            .invitation-block {
                margin-bottom: 78px;
            }

            .block-title {
                margin-bottom: 22px;
                font-size: 10px;
            }

            .envelope-scene {
                min-height: 430px;
            }

            .envelope-viewer.is-square .envelope-scene {
                min-height: 470px;
            }

            .envelope-viewer.is-square .envelope-shell {
                width: 94%;
            }

            .envelope-viewer.is-rectangle .envelope-shell {
                width: 98%;
                height: 52%;
            }

            .envelope-address {
                right: 6%;
                bottom: 14%;
                left: 6%;
            }

            .envelope-address strong {
                font-size: clamp(22px, 7vw, 29px);
            }

            .envelope-address span {
                font-size: clamp(13px, 4.3vw, 17px);
            }


            @keyframes extract-square-card {
                0% {
                    z-index: 2;
                    opacity: 0;
                    transform:
                        translateX(-50%)
                        translateY(28%)
                        scale(0.965);
                }

                42% {
                    z-index: 2;
                    opacity: 1;
                    transform:
                        translateX(-50%)
                        translateY(-24%)
                        scale(0.99);
                }

                43% {
                    z-index: 12;
                }

                100% {
                    z-index: 12;
                    opacity: 1;
                    transform:
                        translateX(-50%)
                        translateY(5%)
                        scale(1.025);
                }
            }

            @keyframes extract-rectangle-card {
                0% {
                    z-index: 2;
                    opacity: 0;
                    transform:
                        translateX(-50%)
                        translateY(28%)
                        scale(0.965);
                }

                42% {
                    z-index: 2;
                    opacity: 1;
                    transform:
                        translateX(-50%)
                        translateY(-50%)
                        scale(0.99);
                }

                43% {
                    z-index: 12;
                }

                100% {
                    z-index: 12;
                    opacity: 1;
                    transform:
                        translateX(-50%)
                        translateY(-34%)
                        scale(1.025);
                }
            }

            @keyframes return-square-card {
                0% {
                    z-index: 12;
                    opacity: 1;
                    transform:
                        translateX(-50%)
                        translateY(5%)
                        scale(1.025);
                }

                48% {
                    z-index: 12;
                    transform:
                        translateX(-50%)
                        translateY(-24%)
                        scale(0.99);
                }

                49% {
                    z-index: 2;
                }

                100% {
                    z-index: 2;
                    opacity: 0;
                    transform:
                        translateX(-50%)
                        translateY(28%)
                        scale(0.965);
                }
            }

            @keyframes return-rectangle-card {
                0% {
                    z-index: 12;
                    opacity: 1;
                    transform:
                        translateX(-50%)
                        translateY(-34%)
                        scale(1.025);
                }

                48% {
                    z-index: 12;
                    transform:
                        translateX(-50%)
                        translateY(-50%)
                        scale(0.99);
                }

                49% {
                    z-index: 2;
                }

                100% {
                    z-index: 2;
                    opacity: 0;
                    transform:
                        translateX(-50%)
                        translateY(28%)
                        scale(0.965);
                }
            }

            .face-controls {
                flex-wrap: wrap;
                row-gap: 11px;
            }

            .lightbox {
                padding: 70px 12px 66px;
            }

            .lightbox img {
                max-width: 96vw;
                max-height: 79vh;
            }

            .lightbox-close {
                top: 14px;
                right: 14px;
                width: 42px;
                height: 42px;
            }

            .lightbox-arrow {
                top: auto;
                bottom: 14px;
                width: 44px;
                height: 44px;
                transform: none;
            }

            .lightbox-previous {
                left: 15px;
            }

            .lightbox-next {
                right: 15px;
            }
        }

        @media (hover: none) {
            .invitation-card:hover img {
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <link rel="stylesheet" href="/mariage/components/menu-lateral.css?v=8">

</head>

<body>

    <main class="page-shell">

        <section class="hero">

            <p class="eyebrow">Le commencement</p>

            <h1>L’invitation</h1>

            <p class="intro">
                Tout a commencé par une invitation.<br>
                Retrouvez ici les faire-part qui annonçaient cette journée si particulière.
            </p>

        </section>

        <section class="invitations-page" aria-label="Les faire-part du mariage">

            <div class="invitations-inner">

                <section class="invitation-block">

                    <div
                        class="envelope-viewer is-square"
                        data-viewer="0"
                    >

                        <div class="envelope-scene">

                            <div class="envelope-shell">

                                <div class="envelope-back"></div>

                                <button
                                    class="invitation-card"
                                    type="button"
                                    data-open-lightbox
                                    aria-label="Agrandir le faire-part cérémonies et vin d’honneur"
                                >
                                    <img
                                        src="../images/faireparts/fairepartvinhonneurrecto.jpg"
                                        alt="Faire-part cérémonies et vin d’honneur — recto"
                                    >
                                </button>

                                <div class="envelope-front"></div>
                                <div class="envelope-bottom-fold"></div>
                                <div class="envelope-flap"></div>

                                <div class="envelope-bottom-fold"></div>
                                <div class="envelope-flap"></div>

                                <div class="envelope-address">
                                    <strong>Invitation</strong>
                                    <span>
                                        Cérémonies, vin d’honneur<br>
                                        &amp; soirée
                                    </span>
                                </div>

                                <button

    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-label="Agrandissement du faire-part"
    >

        <button
            class="lightbox-close"
            id="lightboxClose"
            type="button"
            aria-label="Fermer"
        >
            ×
        </button>

        <button
            class="lightbox-arrow lightbox-previous"
            type="button"
            data-lightbox-direction="-1"
            aria-label="Afficher la face précédente"
        >
            ‹
        </button>

        <img id="lightboxImage" alt="Faire-part agrandi">

        <button
            class="lightbox-arrow lightbox-next"
            type="button"
            data-lightbox-direction="1"
            aria-label="Afficher la face suivante"
        >
            ›
        </button>

    </div>

    <script>
        (() => {
            const galleries = [
                [
                    {
                        src: "../images/faireparts/fairepartvinhonneurrecto.jpg",
                        alt: "Faire-part cérémonies et vin d’honneur — recto"
                    },
                    {
                        src: "../images/faireparts/fairepartvinhonneurverso.jpg",
                        alt: "Faire-part cérémonies et vin d’honneur — verso"
                    }
                ],
                [
                    {
                        src: "../images/faireparts/fairepartrepasrecto.jpg",
                        alt: "Faire-part cérémonies, vin d’honneur et soirée — recto"
                    },
                    {
                        src: "../images/faireparts/fairepartrepasverso.jpg",
                        alt: "Faire-part cérémonies, vin d’honneur et soirée — verso"
                    }
                ]
            ];

            const currentFaces = [0, 0];

            const lightbox = document.getElementById("lightbox");
            const lightboxImage = document.getElementById("lightboxImage");
            const lightboxClose = document.getElementById("lightboxClose");

            let currentViewer = 0;

            function getViewer(viewerIndex) {
                return document.querySelector(
                    `.envelope-viewer[data-viewer="${viewerIndex}"]`
                );
            }

            function updateViewer(viewerIndex, faceIndex) {
                const viewer = getViewer(viewerIndex);
                const image = viewer.querySelector(".invitation-card img");
                const face = galleries[viewerIndex][faceIndex];

                currentFaces[viewerIndex] = faceIndex;
                image.src = face.src;
                image.alt = face.alt;

                viewer.querySelectorAll(".face-button").forEach((button) => {
                    button.classList.toggle(
                        "is-active",
                        Number(button.dataset.face) === faceIndex
                    );
                });

                if (
                    lightbox.classList.contains("open") &&
                    currentViewer === viewerIndex
                ) {
                    lightboxImage.src = face.src;
                    lightboxImage.alt = face.alt;
                }
            }

            function setEnvelopeOpen(viewer, isOpen) {
                const trigger = viewer.querySelector("[data-toggle-envelope]");

                if (isOpen) {
                    viewer.classList.remove("is-closing");
                    viewer.classList.add("is-open");
                    trigger.setAttribute("aria-expanded", "true");
                    return;
                }

                if (!viewer.classList.contains("is-open")) {
                    return;
                }

                viewer.classList.add("is-closing");
                trigger.setAttribute("aria-expanded", "false");

                window.setTimeout(() => {
                    viewer.classList.remove("is-open", "is-closing");
                }, 780);
            }

            function openLightbox(viewerIndex) {
                const viewer = getViewer(viewerIndex);

                if (!viewer.classList.contains("is-open")) {
                    setEnvelopeOpen(viewer, true);
                    return;
                }

                currentViewer = viewerIndex;

                const face = galleries[viewerIndex][currentFaces[viewerIndex]];

                lightboxImage.src = face.src;
                lightboxImage.alt = face.alt;

                lightbox.classList.add("open");
                lightbox.setAttribute("aria-hidden", "false");
                document.body.classList.add("lightbox-open");
                lightboxClose.focus();
            }

            function closeLightbox() {
                lightbox.classList.remove("open");
                lightbox.setAttribute("aria-hidden", "true");
                document.body.classList.remove("lightbox-open");
            }

            function changeLightboxFace(direction) {
                const faceCount = galleries[currentViewer].length;
                const nextFace =
                    (
                        currentFaces[currentViewer] +
                        direction +
                        faceCount
                    ) % faceCount;

                updateViewer(currentViewer, nextFace);
            }

            document.querySelectorAll(".envelope-viewer").forEach((viewer) => {
                const viewerIndex = Number(viewer.dataset.viewer);
                const trigger = viewer.querySelector("[data-toggle-envelope]");

                trigger.addEventListener("click", () => {
                    setEnvelopeOpen(
                        viewer,
                        !viewer.classList.contains("is-open")
                    );
                });

                viewer.querySelectorAll("[data-face]").forEach((button) => {
                    button.addEventListener("click", () => {
                        updateViewer(
                            viewerIndex,
                            Number(button.dataset.face)
                        );
                    });
                });

                viewer
                    .querySelector("[data-close-envelope]")
                    .addEventListener("click", () => {
                        setEnvelopeOpen(viewer, false);
                    });

                viewer
                    .querySelector("[data-open-lightbox]")
                    .addEventListener("click", () => {
                        openLightbox(viewerIndex);
                    });

                updateViewer(viewerIndex, 0);
            });

            lightboxClose.addEventListener("click", closeLightbox);

            document
                .querySelectorAll("[data-lightbox-direction]")
                .forEach((button) => {
                    button.addEventListener("click", () => {
                        changeLightboxFace(
                            Number(button.dataset.lightboxDirection)
                        );
                    });
                });

            lightbox.addEventListener("click", (event) => {
                if (event.target === lightbox) {
                    closeLightbox();
                }
            });

            document.addEventListener("keydown", (event) => {
                if (!lightbox.classList.contains("open")) {
                    return;
                }

                if (event.key === "Escape") {
                    closeLightbox();
                }

                if (event.key === "ArrowLeft") {
                    changeLightboxFace(-1);
                }

                if (event.key === "ArrowRight") {
                    changeLightboxFace(1);
                }
            });
        })();
    </script>

</body>
