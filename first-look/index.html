<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Le First Look d’Élodie et Alexandre, quelques instants avant la cérémonie du 23 mai 2026."
    >

    <title>Le First Look — Élodie & Alexandre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="preload"
        as="image"
        href="../images/first-look/first-look-0001.jpg"
        fetchpriority="high"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --paper: #fefefe;
            --white: #ffffff;
            --background: #fefefe;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        body.lightbox-open {
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        button {
            font: inherit;
        }

        /* =========================
           CONTENU
        ========================= */

        .page-shell {
            min-height: 100vh;
            opacity: 1;
            transform: translateX(0);
            transition:
                transform 400ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 400ms ease;
            will-change: transform, opacity;
        }

        body.page-leaving .page-shell {
            opacity: 0;
            transform: translateX(-34px);
        }

        .hero {
            padding: 58px 30px 52px;
            background: var(--background);
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 14px;
            color: rgba(99, 9, 9, 0.72);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.30em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(26px, 2.2vw, 30px);
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1::after {
            display: block;
            width: 88px;
            height: 1px;
            margin: 18px auto 0;
            background: rgba(99, 9, 9, 0.48);
            content: "";
        }

        .intro {
            max-width: 650px;
            margin: 18px auto 0;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            letter-spacing: 0.04em;
        }







        /* =========================
           GALERIE ÉDITORIALE
        ========================= */

        .gallery-section {
            padding: 48px 40px 72px;
            border-top: 1px solid var(--line);
            background: var(--soft);
        }

        .gallery-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
            max-width: 1180px;
            margin: 0 auto 26px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(99, 9, 9, 0.16);
        }

        .gallery-heading p {
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .gallery-heading h2 {
            max-width: 540px;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.65;
            text-align: right;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 11px;
            max-width: 1180px;
            margin: auto;
        }

        .gallery-item {
            position: relative;
            display: block;
            overflow: hidden;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #e9e3df;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 280px 280px;
        }

        .gallery-item::after {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.26);
            content: "";
            pointer-events: none;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            filter: saturate(0.86) contrast(0.98);
            backface-visibility: hidden;
            transform: translateZ(0);
            transition:
                transform 0.65s ease,
                filter 0.45s ease;
            will-change: transform, filter;
        }

        .gallery-item:hover img {
            filter: saturate(1.03) contrast(1.01);
            transform: translateZ(0) scale(1.045);
        }

        .gallery-item:focus-visible {
            outline: 2px solid var(--bordeaux);
            outline-offset: 4px;
        }

        /* =========================
           PIED DE PAGE
        ========================= */

        .footer {
            padding: 12px 20px 16px;
            background: var(--background);
            text-align: center;
        }

        .footer-name-logo {
            width: 145px;
            max-width: 48vw;
            height: auto;
            margin: 0 auto;
        }

        .footer-date-logo {
            width: 110px;
            max-width: 28vw;
            height: auto;
            margin: 5px auto 0;
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 34px 95px;
            background: rgba(15, 12, 11, 0.96);
            opacity: 0;
            visibility: hidden;
            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .lightbox.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-image {
            display: block;
            max-width: 90vw;
            max-height: 86vh;
            object-fit: contain;
            box-shadow: 0 15px 55px rgba(0, 0, 0, 0.35);
            transform: scale(0.985);
            transition: transform 0.25s ease;
        }

        .lightbox.open .lightbox-image {
            transform: scale(1);
        }

        .lightbox-close,
        .lightbox-arrow {
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .lightbox-close {
            position: fixed;
            top: 22px;
            right: 28px;
            z-index: 2002;
            display: flex;
            width: 46px;
            height: 46px;
            align-items: center;
            justify-content: center;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 29px;
            font-weight: 200;
            line-height: 1;
        }

        .lightbox-close:hover,
        .lightbox-close:focus-visible {
            background: rgba(255, 255, 255, 0.17);
            transform: rotate(4deg);
        }

        .lightbox-arrow {
            position: fixed;
            top: 50%;
            z-index: 2001;
            display: flex;
            width: 52px;
            height: 52px;
            align-items: center;
            justify-content: center;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 31px;
            font-weight: 200;
            transform: translateY(-50%);
        }

        .lightbox-arrow:hover,
        .lightbox-arrow:focus-visible {
            background: rgba(255, 255, 255, 0.2);
        }

        .previous {
            left: 28px;
        }

        .previous:hover {
            transform: translate(-3px, -50%);
        }

        .next {
            right: 28px;
        }

        .next:hover {
            transform: translate(3px, -50%);
        }

        .photo-counter {
            position: fixed;
            bottom: 22px;
            left: 50%;
            z-index: 2002;
            color: rgba(255, 255, 255, 0.76);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            transform: translateX(-50%);
        }

        @media (max-width: 1020px) {
            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .hero {
                padding: 72px 20px 48px;
            }

            .gallery-section {
                padding: 42px 10px 56px;
            }

            .gallery-heading {
                display: block;
                margin-bottom: 22px;
                padding: 0 10px 14px;
            }

            .gallery-heading h2 {
                margin-top: 9px;
                text-align: left;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 7px;
            }

            .lightbox {
                padding: 70px 12px 65px;
            }

            .lightbox-image {
                max-width: 96vw;
                max-height: 79vh;
            }

            .lightbox-close {
                top: 14px;
                right: 14px;
                width: 42px;
                height: 42px;
            }

            .lightbox-arrow {
                top: auto;
                bottom: 14px;
                width: 44px;
                height: 44px;
                transform: none;
            }

            .previous {
                left: 15px;
            }

            .next {
                right: 15px;
            }

            .previous:hover {
                transform: translateX(-2px);
            }

            .next:hover {
                transform: translateX(2px);
            }

            .photo-counter {
                bottom: 29px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <link rel="stylesheet" href="../components/menu-lateral.css?v=51">
    <script src="../components/menu-lateral.js?v=51" defer></script>
</head>

<body>

    <main class="page-shell">

        <section class="hero">

            <p class="eyebrow">Avant la cérémonie</p>

            <h1>Le First Look</h1>

            <p class="intro">
                Le moment où nous nous sommes retrouvés,
                quelques instants avant de nous dire « oui ».
            </p>

        </section>

        <section
            class="gallery-section"
            aria-labelledby="gallery-title"
        >

            <div class="gallery-heading">
                <p>Notre rencontre</p>

                <h2 id="gallery-title">
                    Un instant rien qu’à nous
                </h2>
            </div>

            <div
                class="gallery"
                id="gallery"
                aria-live="off"
            ></div>

        </section>

        <footer class="footer" aria-label="Signature de l’album">

            <img
                src="../images/style/nomsansfond.jpg"
                alt="Élodie et Alexandre"
                class="footer-name-logo"
                loading="lazy"
                decoding="async"
            >

            <img
                src="../images/style/datesansfond.jpg"
                alt="23 mai 2026"
                class="footer-date-logo"
                loading="lazy"
                decoding="async"
            >

        </footer>

    </main>

    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Agrandissement de la photographie"
        aria-hidden="true"
    >

        <button
            type="button"
            class="lightbox-close"
            id="closeButton"
            aria-label="Fermer la photographie"
        >
            ×
        </button>

        <button
            type="button"
            class="lightbox-arrow previous"
            id="previousButton"
            aria-label="Photographie précédente"
        >
            ‹
        </button>

        <img
            class="lightbox-image"
            id="lightboxImage"
            src=""
            alt="First Look d’Élodie et Alexandre"
        >

        <button
            type="button"
            class="lightbox-arrow next"
            id="nextButton"
            aria-label="Photographie suivante"
        >
            ›
        </button>

        <p
            class="photo-counter"
            id="photoCounter"
            aria-live="polite"
        ></p>

    </div>

    <script>
        const firstPhotoNumber = 1;
        const lastPhotoNumber = 64;
        const photoTotal = lastPhotoNumber - firstPhotoNumber + 1;

        const gallery = document.getElementById("gallery");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const photoCounter = document.getElementById("photoCounter");
        const closeButton = document.getElementById("closeButton");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");

        let currentImage = 0;
        let previousFocusedElement = null;
        let touchStartX = 0;
        let touchEndX = 0;

        function formatPhotoNumber(number) {
            return String(number).padStart(4, "0");
        }

        function getPhotoPath(number) {
            return (
                "../images/first-look/" +
                "first-look-" +
                formatPhotoNumber(number) +
                ".jpg"
            );
        }

        const photos = Array.from(
            { length: photoTotal },
            function(_, index) {
                return getPhotoPath(firstPhotoNumber + index);
            }
        );

        const galleryFragment = document.createDocumentFragment();

        photos.forEach(function(path, index) {
            const button = document.createElement("button");
            const image = document.createElement("img");

            button.type = "button";
            button.className = "gallery-item";
            button.setAttribute(
                "aria-label",
                "Agrandir la photographie " +
                (index + 1) +
                " sur " +
                photos.length
            );

            image.src = path;
            image.alt =
                "First Look d’Élodie et Alexandre — photographie " +
                (index + 1) +
                " sur " +
                photos.length;

            image.decoding = "async";

            if (index < 8) {
                image.loading = "eager";
            } else {
                image.loading = "lazy";
            }

            if (index === 0) {
                image.fetchPriority = "high";
            }

            button.appendChild(image);

            button.addEventListener("click", function() {
                openLightbox(index);
            });

            galleryFragment.appendChild(button);
        });

        gallery.appendChild(galleryFragment);

        function preloadAdjacentImages() {
            const previousIndex =
                (currentImage - 1 + photos.length) % photos.length;

            const nextIndex =
                (currentImage + 1) % photos.length;

            [previousIndex, nextIndex].forEach(function(index) {
                const preload = new Image();
                preload.src = photos[index];
            });
        }

        function updateLightbox() {
            lightboxImage.src = photos[currentImage];

            lightboxImage.alt =
                "First Look d’Élodie et Alexandre — photographie " +
                (currentImage + 1) +
                " sur " +
                photos.length;

            photoCounter.textContent =
                (currentImage + 1) +
                " / " +
                photos.length;

            preloadAdjacentImages();
        }

        function openLightbox(index) {
            previousFocusedElement = document.activeElement;
            currentImage = index;

            updateLightbox();

            lightbox.classList.add("open");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.classList.add("lightbox-open");

            closeButton.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightbox.setAttribute("aria-hidden", "true");
            document.body.classList.remove("lightbox-open");

            lightboxImage.src = "";

            if (previousFocusedElement) {
                previousFocusedElement.focus();
            }
        }

        function changeImage(direction) {
            currentImage =
                (currentImage + direction + photos.length) %
                photos.length;

            updateLightbox();
        }

        closeButton.addEventListener("click", closeLightbox);

        previousButton.addEventListener("click", function() {
            changeImage(-1);
        });

        nextButton.addEventListener("click", function() {
            changeImage(1);
        });

        lightbox.addEventListener("click", function(event) {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        lightbox.addEventListener(
            "touchstart",
            function(event) {
                touchStartX = event.changedTouches[0].screenX;
            },
            { passive: true }
        );

        lightbox.addEventListener(
            "touchend",
            function(event) {
                touchEndX = event.changedTouches[0].screenX;

                const distance = touchEndX - touchStartX;

                if (Math.abs(distance) < 55) {
                    return;
                }

                changeImage(distance > 0 ? -1 : 1);
            },
            { passive: true }
        );

        document.addEventListener("keydown", function(event) {
            if (!lightbox.classList.contains("open")) {
                return;
            }

            if (event.key === "Escape") {
                closeLightbox();
            }

            if (event.key === "ArrowLeft") {
                changeImage(-1);
            }

            if (event.key === "ArrowRight") {
                changeImage(1);
            }

            if (event.key === "Tab") {
                const focusableElements = [
                    closeButton,
                    previousButton,
                    nextButton
                ];

                const currentFocusIndex =
                    focusableElements.indexOf(document.activeElement);

                if (event.shiftKey && currentFocusIndex <= 0) {
                    event.preventDefault();
                    nextButton.focus();
                } else if (
                    !event.shiftKey &&
                    currentFocusIndex === focusableElements.length - 1
                ) {
                    event.preventDefault();
                    closeButton.focus();
                }
            }
        });
    </script>

</body>
</html>
