<script>

/* =========================
   DOSSIER DES PHOTOS
========================= */

const dossier = "../images/photobooth/";


/* =========================
   PHOTOS PRINCIPALES
========================= */

const photos = [

    /* COLLE ICI TA LISTE DES 234 PHOTOS PRINCIPALES */

];


/* =========================
   PHOTOS DU PHOTOGRAPHE
========================= */

const photosPhotographe = [

    /* COLLE ICI TA LISTE DES PHOTOS IMG_... */

];


/* =========================
   EXTRACTION DE LA DATE
========================= */

function obtenirDatePhoto(nom) {

    const correspondance = nom.match(
        /(\d{8})_(\d{6})/
    );

    if (!correspondance) {
        return 0;
    }

    return Number(
        correspondance[1] +
        correspondance[2]
    );

}


/* =========================
   TRI CHRONOLOGIQUE
========================= */

const photosPrincipales = photos
    .map(function(photo) {

        return {
            nom: photo,
            date: obtenirDatePhoto(photo)
        };

    })
    .sort(function(a, b) {

        return a.date - b.date;

    });


const photosPhotographeTriees = photosPhotographe
    .map(function(photo) {

        return {
            nom: photo,
            date: obtenirDatePhoto(photo)
        };

    })
    .sort(function(a, b) {

        return a.date - b.date;

    });


/* =========================
   CRÉATION DES GROUPES
========================= */

/*
    LOGIQUE :

    IMG 18:48:37
    IMG 18:48:46
    PHOTO PRINCIPALE 18:49:01

    => GROUPE 1

    IMG 18:49:?? 
    PHOTO PRINCIPALE 18:52:52

    => GROUPE 2

    Chaque photo IMG est donc rattachée
    à la prochaine photo principale.
*/


const groupes = [];


photosPrincipales.forEach(function(photoPrincipale, index) {

    const dateDebut = photoPrincipale.date;


    const datePrincipalePrecedente =

        index > 0

            ? photosPrincipales[index - 1].date

            : 0;


    /*
        On récupère les photos IMG réalisées
        après la photo principale précédente
        et avant la photo principale actuelle.
    */

    const photosDuGroupe = photosPhotographeTriees

        .filter(function(photo) {

            return (

                photo.date > datePrincipalePrecedente &&

                photo.date < dateDebut

            );

        });


    /*
        La photo principale est toujours
        la première photo du groupe.
    */

    groupes.push({

        principale: photoPrincipale.nom,

        photos: [

            photoPrincipale.nom,

            ...photosDuGroupe.map(function(photo) {

                return photo.nom;

            })

        ]

    });

});


/* =========================
   ÉLÉMENTS HTML
========================= */

const gallery =
    document.getElementById("gallery");


const viewer =
    document.getElementById("viewer");


const fullscreen =
    document.getElementById("fullscreen");


const mainPhoto =
    document.getElementById("mainPhoto");


const fullscreenPhoto =
    document.getElementById("fullscreenPhoto");


const thumbnails =
    document.getElementById("thumbnails");


const counter =
    document.getElementById("counter");


let groupeActuel = 0;


let photoActuelle = 0;


/* =========================
   CRÉATION DES VIGNETTES
========================= */

/*
    IMPORTANT :

    La vignette reste la première photo IMG
    du groupe.

    La photo principale n'est donc PAS utilisée
    comme vignette.
*/


groupes.forEach(function(groupe, index) {

    const div =
        document.createElement("div");


    div.className = "photo";


    const img =
        document.createElement("img");


    /*
        La vignette est la première photo IMG.

        Comme la photo principale est placée
        en première position dans groupe.photos,
        on prend la première photo IMG.
    */

    const premierePhotoIMG =
        groupe.photos.find(function(photo) {

            return photo.startsWith("IMG_");

        });


    img.src =
        dossier + premierePhotoIMG;


    img.loading = "lazy";


    div.appendChild(img);


    div.onclick = function() {

        groupeActuel = index;


        /*
            LA PHOTO PRINCIPALE S'AFFICHE EN PREMIER
        */

        photoActuelle = 0;


        afficherPhoto();


        viewer.classList.add("active");


        document.body.style.overflow = "hidden";

    };


    gallery.appendChild(div);

});


/* =========================
   AFFICHER LA PHOTO
========================= */

function afficherPhoto() {

    const groupe =
        groupes[groupeActuel];


    const photo =
        groupe.photos[photoActuelle];


    mainPhoto.src =
        dossier + photo;


    fullscreenPhoto.src =
        dossier + photo;


    counter.textContent =

        "Groupe "

        + (groupeActuel + 1)

        + " / "

        + groupes.length

        + " — Photo "

        + (photoActuelle + 1)

        + " / "

        + groupe.photos.length;


    afficherMiniatures();

}


/* =========================
   MINIATURES
========================= */

function afficherMiniatures() {

    thumbnails.innerHTML = "";


    const groupe =
        groupes[groupeActuel];


    groupe.photos.forEach(function(photo, index) {

        const thumbnail =
            document.createElement("img");


        thumbnail.src =
            dossier + photo;


        thumbnail.className =
            "thumbnail";


        if (index === photoActuelle) {

            thumbnail.classList.add("active");

        }


        thumbnail.onclick = function() {

            photoActuelle = index;


            afficherPhoto();

        };


        thumbnails.appendChild(thumbnail);

    });

}


/* =========================
   PHOTO SUIVANTE
========================= */

function photoSuivante() {

    const groupe =
        groupes[groupeActuel];


    photoActuelle =

        (

            photoActuelle + 1

        )

        %

        groupe.photos.length;


    afficherPhoto();

}


/* =========================
   PHOTO PRÉCÉDENTE
========================= */

function photoPrecedente() {

    const groupe =
        groupes[groupeActuel];


    photoActuelle =

        (

            photoActuelle -

            1 +

            groupe.photos.length

        )

        %

        groupe.photos.length;


    afficherPhoto();

}


/* =========================
   NAVIGATION
========================= */

document.getElementById("next").onclick =
    photoSuivante;


document.getElementById("previous").onclick =
    photoPrecedente;


document.getElementById("fullscreenNext").onclick =
    photoSuivante;


document.getElementById("fullscreenPrevious").onclick =
    photoPrecedente;


/* =========================
   PLEIN ÉCRAN
========================= */

mainPhoto.onclick = function() {

    fullscreen.classList.add("active");

};


document.getElementById("fullscreenClose").onclick =
function() {

    fullscreen.classList.remove("active");

};


/* =========================
   FERMETURE
========================= */

document.getElementById("close").onclick =
function() {

    viewer.classList.remove("active");


    fullscreen.classList.remove("active");


    document.body.style.overflow = "";

};


/* =========================
   TÉLÉCHARGER UNE PHOTO
========================= */

document.getElementById("downloadPhoto").onclick =
function() {

    const groupe =
        groupes[groupeActuel];


    const photo =
        groupe.photos[photoActuelle];


    const lien =
        document.createElement("a");


    lien.href =
        dossier + photo;


    lien.download =
        photo;


    lien.click();

};


/* =========================
   TÉLÉCHARGER LE GROUPE
========================= */

document.getElementById("downloadGroup").onclick =
function() {

    const groupe =
        groupes[groupeActuel];


    groupe.photos.forEach(function(photo, index) {

        setTimeout(function() {

            const lien =
                document.createElement("a");


            lien.href =
                dossier + photo;


            lien.download =
                photo;


            lien.click();

        }, index * 300);

    });

};


/* =========================
   CLAVIER
========================= */

document.addEventListener("keydown", function(event) {

    if (!viewer.classList.contains("active")) {

        return;

    }


    if (event.key === "ArrowRight") {

        photoSuivante();

    }


    if (event.key === "ArrowLeft") {

        photoPrecedente();

    }


    if (event.key === "Escape") {

        if (fullscreen.classList.contains("active")) {

            fullscreen.classList.remove("active");

        }

        else {

            viewer.classList.remove("active");

            document.body.style.overflow = "";

        }

    }

});


/* =========================
   SWIPE MOBILE
========================= */

let touchStartX = 0;


let touchEndX = 0;


viewer.addEventListener("touchstart", function(event) {

    touchStartX =
        event.changedTouches[0].screenX;

});


viewer.addEventListener("touchend", function(event) {

    touchEndX =
        event.changedTouches[0].screenX;


    const difference =
        touchStartX - touchEndX;


    if (Math.abs(difference) < 50) {

        return;

    }


    if (difference > 0) {

        photoSuivante();

    }

    else {

        photoPrecedente();

    }

});

</script>
