<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        content="Les photos du photobooth du mariage d’Élodie et Alexandre, célébré le 23 mai 2026."
    >

    <title>Mariette La Photobooth — Élodie & Alexandre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link

        as="image"

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --white: #ffffff;
            --background: #fefefe;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        body.viewer-open {
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        button {
            font: inherit;
        }

        .page-shell {
            min-height: 100vh;
            opacity: 1;
            transform: translateX(0);
            transition:
                transform 400ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 400ms ease;
            will-change: transform, opacity;
        }

        body.page-leaving .page-shell {
            opacity: 0;
            transform: translateX(-34px);
        }

        /* =========================
           EN-TÊTE
        ========================= */

        .hero {
            padding: 58px 30px 52px;
            background: var(--background);
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 14px;
            color: rgba(99, 9, 9, 0.72);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.30em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(26px, 2.2vw, 30px);
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1::after {
            display: block;
            width: 88px;
            height: 1px;
            margin: 18px auto 0;
            background: rgba(99, 9, 9, 0.48);
            content: "";
        }

        .intro {
            max-width: 680px;
            margin: 18px auto 0;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            letter-spacing: 0.04em;
        }

        /* =========================
           NAVIGATION DES SOUVENIRS
        ========================= */

        .souvenir-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            padding: 22px 40px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: var(--white);
        }

        .souvenir-nav-back {
            justify-self: start;
        }

        .souvenir-nav-pages {
            display: flex;
            grid-column: 3;
            justify-self: end;
            gap: 10px;
        }

        .souvenir-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 1px solid rgba(99, 9, 9, 0.24);
            border-radius: 999px;
            background: var(--white);
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-decoration: none;
            text-transform: uppercase;
            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .souvenir-link:hover,
        .souvenir-link:focus-visible {
            border-color: var(--bordeaux);
            background: var(--bordeaux);
            color: var(--white);
            transform: translateY(-2px);
        }



        /* =========================
           ICÔNES DE NAVIGATION
        ========================= */

        .souvenir-link {
            gap: 10px;
        }

        .souvenir-link-icon {
            display: inline-flex;
            width: 18px;
            height: 12px;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            color: currentColor;
            opacity: 0.86;
            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .souvenir-link-icon svg {
            width: 18px;
            height: 12px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.45;
        }

        .souvenir-link:hover .souvenir-link-icon,
        .souvenir-link:focus-visible .souvenir-link-icon {
            opacity: 1;
        }

        .souvenir-link:hover .souvenir-link-icon.is-previous,
        .souvenir-link:focus-visible .souvenir-link-icon.is-previous,
        .souvenir-link:hover .souvenir-link-icon.is-return,
        .souvenir-link:focus-visible .souvenir-link-icon.is-return {
            transform: translateX(-4px);
        }

        .souvenir-link:hover .souvenir-link-icon.is-next,
        .souvenir-link:focus-visible .souvenir-link-icon.is-next {
            transform: translateX(4px);
        }

        /* =========================
           GALERIE
        ========================= */

        .gallery-section {
            padding: 48px 40px 72px;
            background: var(--soft);
        }

        .gallery-heading {
            display: grid;
            width: 100%;
            max-width: 1180px;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: end;
            gap: 30px;
            margin: 0 auto 26px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(99, 9, 9, 0.16);
        }

        .gallery-heading p {
            justify-self: start;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .gallery-heading h2 {
            justify-self: end;
            max-width: 540px;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.65;
            text-align: right;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 11px;
            max-width: 1180px;
            margin: auto;
        }

        .photo {
            position: relative;
            display: block;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #e9e3df;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 280px 280px;
        }

        .photo::after {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.26);
            content: "";
            pointer-events: none;
        }

        .photo > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.86) contrast(0.98);
            backface-visibility: hidden;
            transform: translateZ(0);
            transition:
                transform 0.65s ease,
                filter 0.45s ease;
            will-change: transform, filter;
        }

        .photo:hover > img {
            filter: saturate(1.03) contrast(1.01);
            transform: translateZ(0) scale(1.045);
        }

        .photo:focus-visible {
            outline: 2px solid var(--bordeaux);
            outline-offset: 4px;
        }

        /* Badge premium indiquant le nombre de photos */
        .photo-count {
            position: absolute;
            z-index: 3;
            top: 10px;
            right: 10px;
            display: inline-flex;
            min-height: 34px;
            align-items: center;
            gap: 7px;
            padding: 5px 11px 5px 7px;
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            color: var(--bordeaux);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow:
                0 7px 22px rgba(27, 18, 16, 0.18),
                inset 0 0 0 1px rgba(99, 9, 9, 0.035);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
            pointer-events: none;
        }

        .photo:hover .photo-count {
            border-color: rgba(99, 9, 9, 0.70);
            background: rgba(99, 9, 9, 0.92);
            color: var(--white);
            transform: translateY(-1px);
        }

        .photo-count-icon {
            display: grid;
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            place-items: center;
            border-radius: 50%;
            background: rgba(99, 9, 9, 0.09);
            transition: background 0.3s ease;
        }

        .photo:hover .photo-count-icon {
            background: rgba(255, 255, 255, 0.16);
        }

        .photo-count-icon svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.55;
        }

        .photo-count-number {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .photo-count-label {
            color: currentColor;
            font-size: 8px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            opacity: 0.76;
        }

        /* =========================
           VISIONNEUSE
        ========================= */

        .viewer,
        .fullscreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            background: rgba(15, 12, 11, 0.97);
            opacity: 0;
            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .viewer {
            z-index: 2100;
            padding: 34px 95px;
        }

        .fullscreen {
            z-index: 2400;
            background: #050505;
        }

        .viewer.active,
        .fullscreen.active {
            visibility: visible;
            opacity: 1;
        }

        .viewer-content {
            width: 100%;
            max-width: 1200px;
        }

        .main-photo-container {
            display: flex;
            height: 70vh;
            align-items: center;
            justify-content: center;
        }

        .main-photo {
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            cursor: zoom-in;
            box-shadow: 0 15px 55px rgba(0, 0, 0, 0.35);
        }

        .fullscreen img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .viewer-close,
        .fullscreen-close,
        .viewer-arrow {
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            cursor: pointer;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-weight: 200;
            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .viewer-close,
        .fullscreen-close {
            position: fixed;
            top: 22px;
            right: 28px;
            z-index: 2500;
            display: flex;
            width: 46px;
            height: 46px;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            line-height: 1;
        }

        .viewer-close:hover,
        .viewer-close:focus-visible,
        .fullscreen-close:hover,
        .fullscreen-close:focus-visible {
            background: rgba(255, 255, 255, 0.17);
            transform: rotate(4deg);
        }

        .viewer-arrow {
            position: fixed;
            top: 50%;
            z-index: 2450;
            display: flex;
            width: 52px;
            height: 52px;
            align-items: center;
            justify-content: center;
            font-size: 31px;
            transform: translateY(-50%);
        }

        .viewer-arrow:hover,
        .viewer-arrow:focus-visible {
            background: rgba(255, 255, 255, 0.20);
        }

        .viewer-arrow-left {
            left: 28px;
        }

        .viewer-arrow-left:hover {
            transform: translate(-3px, -50%);
        }

        .viewer-arrow-right {
            right: 28px;
        }

        .viewer-arrow-right:hover {
            transform: translate(3px, -50%);
        }

        .thumbnails {
            display: flex;
            min-height: 76px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 18px;
            overflow: hidden;
        }

        .thumbnail {
            width: 64px;
            height: 64px;
            padding: 0;
            overflow: hidden;
            border: 2px solid transparent;
            background: transparent;
            cursor: pointer;
            opacity: 0.45;
            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail.active {
            border-color: var(--white);
            opacity: 1;
            transform: scale(1.05);
        }

        .viewer-counter {
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.76);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-align: center;
            text-transform: uppercase;
        }

        /* =========================
           PIED DE PAGE
        ========================= */

        .footer {
            padding: 12px 20px 16px;
            background: var(--background);
            text-align: center;
        }

        .footer-name-logo {
            width: 145px;
            max-width: 48vw;
            height: auto;
            margin: 0 auto;
        }

        .footer-date-logo {
            width: 110px;
            max-width: 28vw;
            height: auto;
            margin: 5px auto 0;
        }

        @media (max-width: 1020px) {
            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .hero {
                padding: 72px 20px 48px;
            }

            .souvenir-nav {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 20px 16px;
            }

            .souvenir-nav-back,
            .souvenir-nav-pages {
                width: 100%;
                grid-column: 1;
                justify-self: stretch;
            }

            .souvenir-nav-pages {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .souvenir-link {
                width: 100%;
            }

            .gallery-section {
                padding: 42px 10px 56px;
            }

            .gallery-heading {
                grid-template-columns: 1fr;
                gap: 9px;
                margin-bottom: 22px;
                padding: 0 10px 14px;
            }

            .gallery-heading h2 {
                justify-self: start;
                text-align: left;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 7px;
            }

            .photo-count {
                top: 6px;
                right: 6px;
                min-height: 30px;
                gap: 5px;
                padding: 4px 8px 4px 5px;
            }

            .photo-count-icon {
                width: 20px;
                height: 20px;
                flex-basis: 20px;
            }

            .photo-count-label {
                display: none;
            }

            .viewer {
                padding: 70px 12px 105px;
            }

            .main-photo-container {
                height: 62vh;
            }

            .main-photo {
                max-width: 96vw;
                max-height: 62vh;
            }

            .viewer-close,
            .fullscreen-close {
                top: 14px;
                right: 14px;
                width: 42px;
                height: 42px;
            }

            .viewer-arrow {
                top: auto;
                bottom: 14px;
                width: 44px;
                height: 44px;
                transform: none;
            }

            .viewer-arrow-left {
                left: 15px;
            }

            .viewer-arrow-right {
                right: 15px;
            }

            .viewer-arrow-left:hover,
            .viewer-arrow-right:hover {
                transform: none;
            }

            .thumbnail {
                width: 50px;
                height: 50px;
            }
        }

        @media (hover: none) {
            .photo:hover > img {
                filter: saturate(0.86) contrast(0.98);
                transform: none;
            }

            .photo:hover .photo-count {
                border-color: rgba(255, 255, 255, 0.78);
                background: rgba(255, 255, 255, 0.88);
                color: var(--bordeaux);
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

</head>

<body>

    <main class="page-shell">

        <section class="hero">

            <p class="eyebrow">
                Les souvenirs de la soirée
            </p>

            <h1>Mariette La Photobooth</h1>

            <p class="intro">
                Des sourires, des accessoires et beaucoup de spontanéité :
                retrouvez ici tous les passages devant le photobooth.
            </p>

        </section>

        <nav
            class="souvenir-nav"
            aria-label="Navigation entre les souvenirs"
        >
            <a
                href="/mariage/souvenirs/"
                class="souvenir-link souvenir-nav-back"
            >
                <span
                    class="souvenir-link-icon is-return"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 24 16">
                        <path d="M8.5 3 3.5 8l5 5"></path>
                        <path d="M4 8h9.5c3.1 0 5.5 2.2 5.5 5"></path>
                    </svg>
                </span>
                <span>Retour aux souvenirs</span>
            </a>

            <div class="souvenir-nav-pages">
                <a
                    href="/mariage/photosgroupe/"
                    class="souvenir-link"
                >
                    <span
                        class="souvenir-link-icon is-previous"
                        aria-hidden="true"
                    >
                        <svg viewBox="0 0 24 16">
                            <path d="m8 3-5 5 5 5"></path>
                            <path d="M4 8h16"></path>
                        </svg>
                    </span>
                    <span>Photos de groupe</span>
                </a>

                <a
                    href="/mariage/videos/"
                    class="souvenir-link"
                >
                    <span>Vidéos</span>
                    <span
                        class="souvenir-link-icon is-next"
                        aria-hidden="true"
                    >
                        <svg viewBox="0 0 24 16">
                            <path d="m16 3 5 5-5 5"></path>
                            <path d="M20 8H4"></path>
                        </svg>
                    </span>
                </a>
            </div>
        </nav>

        <section
            class="gallery-section"
            aria-labelledby="gallery-title"
        >

            <div class="gallery-heading">
                <p>Les passages</p>

                <h2 id="gallery-title">
                    Chaque vignette réunit les photos prises au même moment
                </h2>
            </div>

            <div
                class="gallery"
                id="gallery"
                aria-live="off"
            ></div>

        </section>

        <footer class="footer" aria-label="Signature de l’album">

            <img
                src="/mariage/images/style/nomsansfond.jpg"
                alt="Élodie et Alexandre"
                class="footer-name-logo"
                loading="lazy"
                decoding="async"
            >

            <img
                src="/mariage/images/style/datesansfond.jpg"
                alt="23 mai 2026"
                class="footer-date-logo"
                loading="lazy"
                decoding="async"
            >

        </footer>

    </main>

    <div
        class="viewer"
        id="viewer"
        role="dialog"
        aria-modal="true"
        aria-label="Photos du passage au photobooth"
        aria-hidden="true"
    >
        <button
            type="button"
            class="viewer-close"
            id="viewerClose"
            aria-label="Fermer les photos"
        >
            ×
        </button>

        <button
            type="button"
            class="viewer-arrow viewer-arrow-left"
            id="previous"
            aria-label="Photo précédente"
        >
            ‹
        </button>

        <div class="viewer-content">

            <div class="main-photo-container">
                <img
                    class="main-photo"
                    id="mainPhoto"
                    src=""
                    alt=""
                >
            </div>

            <div
                class="thumbnails"
                id="thumbnails"
                aria-label="Miniatures du passage"
            ></div>

            <p
                class="viewer-counter"
                id="counter"
                aria-live="polite"
            ></p>

        </div>

        <button
            type="button"
            class="viewer-arrow viewer-arrow-right"
            id="next"
            aria-label="Photo suivante"
        >
            ›
        </button>
    </div>

    <div
        class="fullscreen"
        id="fullscreen"
        role="dialog"
        aria-modal="true"
        aria-label="Photo en plein écran"
        aria-hidden="true"
    >
        <button
            type="button"
            class="fullscreen-close"
            id="fullscreenClose"
            aria-label="Fermer le plein écran"
        >
            ×
        </button>

        <button
            type="button"
            class="viewer-arrow viewer-arrow-left"
            id="fullscreenPrevious"
            aria-label="Photo précédente"
        >
            ‹
        </button>

        <img
            id="fullscreenPhoto"
            src=""
            alt=""
        >

        <button
            type="button"
            class="viewer-arrow viewer-arrow-right"
            id="fullscreenNext"
            aria-label="Photo suivante"
        >
            ›
        </button>
    </div>

    <script>
        const photoFolder = "/mariage/images/photobooth/";

        const mainPhotos = [
            "20260523_184901_640.jpg",
            "20260523_185252_043.jpg",
            "20260523_185417_189.jpg",
            "20260523_185728_781.jpg",
            "20260523_190444_650.jpg",
            "20260523_190619_012_1x.jpg",
            "20260523_190716_155_1x.jpg",
            "20260523_191014_135_1x.jpg",
            "20260523_191129_065.jpg",

        function getPhotoDate(fileName) {
            const match = fileName.match(/(\d{8})_(\d{6})/);

            if (!match) {
                return 0;
            }

            return Number(match[1] + match[2]);
        }

        const sortedMainPhotos = mainPhotos
            .map(function(fileName) {
                return {
                    fileName: fileName,
                    date: getPhotoDate(fileName)
                };
            })
            .sort(function(first, second) {
                return first.date - second.date;
            });

        const sortedPhotographerPhotos = photographerPhotos
            .map(function(fileName) {
                return {
                    fileName: fileName,
                    date: getPhotoDate(fileName)
                };
            })
            .sort(function(first, second) {
                return first.date - second.date;
            });

        const groups = sortedMainPhotos.map(
            function(mainPhoto, index) {
                const previousDate =
                    index === 0
                        ? 0
                        : sortedMainPhotos[index - 1].date;

                const relatedPhotos =
                    sortedPhotographerPhotos.filter(
                        function(photo) {
                            return (
                                photo.date > previousDate &&
                                photo.date < mainPhoto.date
                            );
                        }
                    );

                return {
                    main: mainPhoto.fileName,
                    photos: [
                        mainPhoto.fileName,
                        ...relatedPhotos.map(
                            function(photo) {
                                return photo.fileName;
                            }
                        )
                    ]
                };
            }
        );

        const gallery = document.getElementById("gallery");
        const viewer = document.getElementById("viewer");
        const fullscreen = document.getElementById("fullscreen");
        const mainPhoto = document.getElementById("mainPhoto");
        const fullscreenPhoto =
            document.getElementById("fullscreenPhoto");
        const thumbnails = document.getElementById("thumbnails");
        const counter = document.getElementById("counter");
        const viewerClose = document.getElementById("viewerClose");
        const fullscreenClose =
            document.getElementById("fullscreenClose");

        let currentGroupIndex = 0;
        let currentPhotoIndex = 0;
        let previousFocusedElement = null;
        let touchStartX = 0;
        let touchEndX = 0;

        function createCountBadge(photoCount) {
            const badge = document.createElement("span");
            const icon = document.createElement("span");
            const number = document.createElement("span");
            const label = document.createElement("span");

            badge.className = "photo-count";
            icon.className = "photo-count-icon";
            number.className = "photo-count-number";
            label.className = "photo-count-label";

            icon.setAttribute("aria-hidden", "true");
            icon.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <rect x="5.5" y="6.5" width="13" height="11" rx="1.8"></rect>
                    <path d="M8.5 6.5V5.2c0-.9.7-1.7 1.7-1.7h8.1c1 0 1.7.8 1.7 1.7v7.2c0 .9-.7 1.7-1.7 1.7h-.8"></path>
                    <circle cx="9.5" cy="10.2" r="1.25"></circle>
                    <path d="m7.4 15 3.2-3 2.1 2 1.7-1.5 2.2 2.5"></path>
                </svg>
            `;

            number.textContent = String(photoCount);
            label.textContent =
                photoCount > 1 ? "photos" : "photo";

            badge.append(icon, number, label);
            return badge;
        }

        function createGalleryItem(group, index) {
            const button = document.createElement("button");
            const image = document.createElement("img");

            const thumbnailPhoto =
                group.photos.find(function(fileName) {
                    return fileName.startsWith("IMG_");
                }) || group.main;

            button.type = "button";
            button.className = "photo";
            button.setAttribute(
                "aria-label",
                "Ouvrir le passage " +
                (index + 1) +
                ", comprenant " +
                group.photos.length +
                " photos"
            );

            image.src = photoFolder + thumbnailPhoto;
            image.alt =
                "Photobooth d’Élodie et Alexandre — passage " +
                (index + 1);

            image.decoding = "async";
            image.loading = index < 8 ? "eager" : "lazy";

            if (index === 0) {
                image.fetchPriority = "high";
            }

            button.appendChild(image);
            button.appendChild(
                createCountBadge(group.photos.length)
            );

            button.addEventListener("click", function() {
                openGroup(index);
            });

            return button;
        }

        const galleryFragment = document.createDocumentFragment();

        groups.forEach(function(group, index) {
            galleryFragment.appendChild(
                createGalleryItem(group, index)
            );
        });

        gallery.appendChild(galleryFragment);

        function preloadAdjacentPhotos() {
            const group = groups[currentGroupIndex];

            const previousIndex =
                (
                    currentPhotoIndex -
                    1 +
                    group.photos.length
                ) % group.photos.length;

            const nextIndex =
                (
                    currentPhotoIndex +
                    1
                ) % group.photos.length;

            [previousIndex, nextIndex].forEach(function(index) {
                const preloadImage = new Image();
                preloadImage.src =
                    photoFolder + group.photos[index];
            });
        }

        function updateViewer() {
            const group = groups[currentGroupIndex];
            const fileName = group.photos[currentPhotoIndex];
            const path = photoFolder + fileName;
            const alt =
                "Photobooth d’Élodie et Alexandre — passage " +
                (currentGroupIndex + 1) +
                ", photographie " +
                (currentPhotoIndex + 1) +
                " sur " +
                group.photos.length;

            mainPhoto.src = path;
            mainPhoto.alt = alt;
            fullscreenPhoto.src = path;
            fullscreenPhoto.alt = alt;

            counter.textContent =
                "Passage " +
                (currentGroupIndex + 1) +
                " / " +
                groups.length +
                "  ·  Photo " +
                (currentPhotoIndex + 1) +
                " / " +
                group.photos.length;

            updateThumbnails();
            preloadAdjacentPhotos();
        }

        function updateThumbnails() {
            const group = groups[currentGroupIndex];
            const fragment = document.createDocumentFragment();

            thumbnails.innerHTML = "";

            group.photos.forEach(function(fileName, index) {
                const button = document.createElement("button");
                const image = document.createElement("img");

                button.type = "button";
                button.className = "thumbnail";
                button.setAttribute(
                    "aria-label",
                    "Afficher la photographie " +
                    (index + 1) +
                    " sur " +
                    group.photos.length
                );

                if (index === currentPhotoIndex) {
                    button.classList.add("active");
                    button.setAttribute("aria-current", "true");
                }

                image.src = photoFolder + fileName;
                image.alt = "";
                image.decoding = "async";

                button.appendChild(image);

                button.addEventListener("click", function() {
                    currentPhotoIndex = index;
                    updateViewer();
                });

                fragment.appendChild(button);
            });

            thumbnails.appendChild(fragment);
        }

        function openGroup(index) {
            previousFocusedElement = document.activeElement;
            currentGroupIndex = index;
            currentPhotoIndex = 0;

            updateViewer();

            viewer.classList.add("active");
            viewer.setAttribute("aria-hidden", "false");
            document.body.classList.add("viewer-open");

            viewerClose.focus();
        }

        function closeViewer() {
            viewer.classList.remove("active");
            viewer.setAttribute("aria-hidden", "true");
            fullscreen.classList.remove("active");
            fullscreen.setAttribute("aria-hidden", "true");
            document.body.classList.remove("viewer-open");

            mainPhoto.src = "";
            fullscreenPhoto.src = "";
            thumbnails.innerHTML = "";

            if (previousFocusedElement) {
                previousFocusedElement.focus();
            }
        }

        function showNextPhoto() {
            const group = groups[currentGroupIndex];

            currentPhotoIndex =
                (
                    currentPhotoIndex +
                    1
                ) % group.photos.length;

            updateViewer();
        }

        function showPreviousPhoto() {
            const group = groups[currentGroupIndex];

            currentPhotoIndex =
                (
                    currentPhotoIndex -
                    1 +
                    group.photos.length
                ) % group.photos.length;

            updateViewer();
        }

        function openFullscreen() {
            fullscreen.classList.add("active");
            fullscreen.setAttribute("aria-hidden", "false");
            fullscreenClose.focus();
        }

        function closeFullscreen() {
            fullscreen.classList.remove("active");
            fullscreen.setAttribute("aria-hidden", "true");
            viewerClose.focus();
        }

        document
            .getElementById("next")
            .addEventListener("click", showNextPhoto);

        document
            .getElementById("previous")
            .addEventListener("click", showPreviousPhoto);

        document
            .getElementById("fullscreenNext")
            .addEventListener("click", showNextPhoto);

        document
            .getElementById("fullscreenPrevious")
            .addEventListener("click", showPreviousPhoto);

        viewerClose.addEventListener("click", closeViewer);
        fullscreenClose.addEventListener(
            "click",
            closeFullscreen
        );

        mainPhoto.addEventListener("click", openFullscreen);

        viewer.addEventListener("click", function(event) {
            if (event.target === viewer) {
                closeViewer();
            }
        });

        fullscreen.addEventListener("click", function(event) {
            if (event.target === fullscreen) {
                closeFullscreen();
            }
        });

        viewer.addEventListener(
            "touchstart",
            function(event) {
                touchStartX =
                    event.changedTouches[0].screenX;
            },
            { passive: true }
        );

        viewer.addEventListener(
            "touchend",
            function(event) {
                touchEndX =
                    event.changedTouches[0].screenX;

                const distance =
                    touchEndX - touchStartX;

                if (Math.abs(distance) < 55) {
                    return;
                }

                if (distance > 0) {
                    showPreviousPhoto();
                } else {
                    showNextPhoto();
                }
            },
            { passive: true }
        );

        document.addEventListener("keydown", function(event) {
            if (fullscreen.classList.contains("active")) {
                if (event.key === "Escape") {
                    closeFullscreen();
                }

                if (event.key === "ArrowLeft") {
                    showPreviousPhoto();
                }

                if (event.key === "ArrowRight") {
                    showNextPhoto();
                }

                return;
            }

            if (!viewer.classList.contains("active")) {
                return;
            }

            if (event.key === "Escape") {
                closeViewer();
            }

            if (event.key === "ArrowLeft") {
                showPreviousPhoto();
            }

            if (event.key === "ArrowRight") {
                showNextPhoto();
            }
        });
    </script>
