<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Les préparatifs du mariage d’Élodie et Alexandre, célébré le 23 mai 2026."
    >

    <title>Les préparatifs — Élodie & Alexandre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link
        rel="preload"
        as="image"
        href="../images/preparatifs-elodie/Pre%CC%81paratifs%20%20-%20Elodie%20%26%20Alexandre-10.jpg"
    >
    <link
        rel="preload"
        as="image"
        href="../images/vignettes/vignette_preparatifs_alexandre.jpg"
    >

    <style id="page-style">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bordeaux: #630909;
            --bordeaux-dark: #4f0707;
            --text: #403936;
            --muted: #746b67;
            --line: #e8dfda;
            --soft: #f8f5f3;
            --paper: #fefefe;
            --white: #ffffff;
            --background: #fefefe;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        /* =========================
           PAGE PRÉPARATIFS
        ========================= */

        .page-shell {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            opacity: 1;
            transform: translateX(0);
            transition:
                transform 400ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 400ms ease;
            will-change: transform, opacity;
        }

        body.page-leaving .page-shell {
            opacity: 0;
            transform: translateX(-34px);
        }

        .preparatifs-page {
            display: flex;
            flex: 1;
            flex-direction: column;
            background: var(--background);
        }

        .hero {
            padding: 48px 30px 38px;
            text-align: center;
        }

        .eyebrow {
            margin-bottom: 14px;
            color: rgba(99, 9, 9, 0.72);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.30em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: clamp(26px, 2.2vw, 30px);
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1::after {
            display: block;
            width: 88px;
            height: 1px;
            margin: 18px auto 0;
            background: rgba(99, 9, 9, 0.48);
            content: "";
        }

        .intro {
            max-width: 650px;
            margin: 18px auto 0;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.75;
            letter-spacing: 0.04em;
        }

        .choices-section {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: flex-start;
            padding: 48px 40px 72px;
            border-top: 1px solid var(--line);
            background: var(--soft);
        }

        .choices-heading {
            display: grid;
            width: 100%;
            max-width: 1180px;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: end;
            gap: 30px;
            margin: 0 auto 26px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(99, 9, 9, 0.16);
        }

        .choices-heading p {
            justify-self: start;
            margin: 0;
            color: var(--bordeaux);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-align: left;
            text-transform: uppercase;
        }

        .choices-heading h2 {
            justify-self: end;
            max-width: 540px;
            margin: 0;
            color: var(--muted);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.65;
            text-align: right;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        .choice {
            position: relative;
            display: block;
            min-height: 460px;
            overflow: hidden;
            border: 1px solid rgba(99, 9, 9, 0.10);
            border-radius: 5px;
            background: #d8d1cd;
            color: #fffaf7;
            text-decoration: none;
            cursor: pointer;
            isolation: isolate;
            transition:
                transform 0.45s ease,
                box-shadow 0.45s ease,
                border-color 0.45s ease;
        }

        .choice::before {
            position: absolute;
            inset: 0;
            z-index: -2;
            background: var(--choice-image) center / cover no-repeat;
            content: "";
            filter:
                grayscale(1)
                saturate(0.12)
                contrast(0.92)
                brightness(0.92);
            backface-visibility: hidden;
            transform: translateZ(0) scale(1.015);
            transition:
                filter 0.75s ease,
                transform 0.85s ease;
            will-change: transform, filter;
        }

        .choice::after {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(
                    180deg,
                    rgba(42, 31, 29, 0.28) 0%,
                    rgba(42, 31, 29, 0.05) 45%,
                    rgba(42, 31, 29, 0.08) 66%,
                    rgba(42, 31, 29, 0.62) 100%
                ),
                rgba(228, 216, 208, 0.18);
            content: "";
            transition: background 0.65s ease;
        }

        .choice:hover {
            z-index: 2;
            border-color: rgba(99, 9, 9, 0.34);
            box-shadow: 0 24px 55px rgba(52, 35, 31, 0.22);
            transform: translateY(-7px);
        }

        .choice:hover::before {
            filter:
                grayscale(0)
                saturate(1.18)
                contrast(1.04)
                brightness(1.01);
            transform: translateZ(0) scale(1.06);
        }

        .choice:hover::after {
            background:
                linear-gradient(
                    180deg,
                    rgba(32, 23, 21, 0.34) 0%,
                    rgba(32, 23, 21, 0.04) 45%,
                    rgba(32, 23, 21, 0.02) 64%,
                    rgba(32, 23, 21, 0.36) 100%
                );
        }

        .choice-inner {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 38px 40px;
        }

        .choice-kicker {
            margin-bottom: 12px;
            color: rgba(255, 250, 247, 0.90);
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }

        .choice h3 {
            color: #fffaf7;
            font-size: clamp(1.65rem, 2.5vw, 2.25rem);
            font-weight: normal;
            line-height: 1.18;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.48);
            transition: transform 0.6s ease;
        }

        .choice h3::after {
            display: block;
            width: 0;
            height: 1px;
            margin: 15px 0 0;
            background: rgba(255, 250, 247, 0.90);
            content: "";
            transition: width 0.45s ease;
        }

        .choice-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            color: #fffaf7;
            font-family: "Montserrat", Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 1.8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.48);
            text-transform: uppercase;
        }

        .choice-link::after {
            font-size: 17px;
            content: "→";
            transition: transform 0.3s ease;
        }

        .choice:hover h3 {
            transform: translateY(-5px);
        }

        .choice:hover h3::after {
            width: 42px;
        }

        .choice:hover .choice-link::after {
            transform: translateX(5px);
        }

        .footer {
            flex: 0 0 auto;
            padding: 12px 20px 16px;
            background: var(--background);
            text-align: center;
        }

        .footer-name-logo {
            width: 145px;
            max-width: 48vw;
            height: auto;
            margin: 0 auto;
        }

        .footer-date-logo {
            width: 110px;
            max-width: 28vw;
            height: auto;
            margin: 5px auto 0;
        }

        /* Mise en page compacte pour conserver l’affichage sur un seul écran */
        @media (min-width: 721px) and (max-height: 760px) {
            .hero {
                padding-top: 27px;
                padding-bottom: 23px;
            }

            .eyebrow {
                margin-bottom: 9px;
            }

            h1::after {
                margin-top: 12px;
            }

            .intro {
                margin-top: 12px;
                line-height: 1.6;
            }

            .choices-section {
                padding-top: 32px;
                padding-bottom: 42px;
            }

            .choices-heading {
                margin-bottom: 20px;
                padding-bottom: 13px;
            }

            .choices {
                max-width: 1180px;
            }

            .choice {
                min-height: 360px;
            }

            .choice-inner {
                padding: 24px 28px;
            }

            .footer {
                padding-top: 6px;
                padding-bottom: 8px;
            }

            .footer-name-logo {
                width: 122px;
            }

            .footer-date-logo {
                width: 68px;
                margin-top: 2px;
            }
        }
        @media (max-width: 900px) {
            .choices {
                gap: 18px;
            }

            .choice {
                min-height: 360px;
            }
        }

        @media (max-width: 720px) {
            .hero {
                padding: 68px 20px 48px;
            }

            .choices-section {
                justify-content: flex-start;
                padding: 42px 10px 56px;
            }

            .choices-heading {
                display: grid;
                grid-template-columns: 1fr;
                gap: 9px;
                margin-bottom: 22px;
                padding: 0 10px 14px;
            }

            .choices-heading h2 {
                justify-self: start;
                margin-top: 0;
                text-align: left;
            }

            .choices {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .choice {
                min-height: 350px;
            }

            .choice-inner {
                padding: 28px 26px;
            }

            .choice h3 {
                font-size: 1.7rem;
            }
        }

        @media (hover: none) {
            .choice::before {
                filter:
                    grayscale(0.35)
                    saturate(0.72)
                    contrast(0.98)
                    brightness(0.96);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <link rel="stylesheet" href="../components/menu-lateral.css?v=51">
    <script src="../components/menu-lateral.js?v=51" defer></script>
</head>

<body>
<main class="page-shell">
        <section class="preparatifs-page">

            <header class="hero">

                <p class="eyebrow">Avant la cérémonie</p>

                <h1>Les préparatifs</h1>

                <p class="intro">
                    Avant de nous retrouver, chacun de notre côté,
                    nous nous sommes préparés entourés de nos proches.
                </p>

            </header>

            <section class="choices-section" aria-label="Choisir les préparatifs à découvrir">

                <div class="choices-heading">
                    <p>Deux histoires</p>
                    <h2>Découvrez ces derniers instants avant de nous retrouver.</h2>
                </div>

                <div class="choices">

                    <a
                        href="elodie/index.html"
                        class="choice"
                        style="--choice-image: url('../images/preparatifs-elodie/Pre%CC%81paratifs%20%20-%20Elodie%20%26%20Alexandre-10.jpg');"
                    >
                        <div class="choice-inner">
                            <span class="choice-kicker">Ses préparatifs</span>
                            <h3>Élodie</h3>
                            <span class="choice-link">Découvrir</span>
                        </div>
                    </a>

                    <a
                        href="alexandre/index.html"
                        class="choice"
                        style="--choice-image: url('../images/vignettes/vignette_preparatifs_alexandre.jpg');"
                    >
                        <div class="choice-inner">
                            <span class="choice-kicker">Ses préparatifs</span>
                            <h3>Alexandre</h3>
                            <span class="choice-link">Découvrir</span>
                        </div>
                    </a>

                </div>
            </section>

        </section>

        <footer class="footer" aria-label="Signature de l’album">

            <img
                src="../images/style/nomsansfond.jpg"
                alt="Élodie et Alexandre"
                class="footer-name-logo"
            >

            <img
                src="../images/style/datesansfond.jpg"
                alt="23 mai 2026"
                class="footer-date-logo"
            >

        </footer>

    </main>

</body>
</html>
